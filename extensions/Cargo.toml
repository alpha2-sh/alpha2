[package]
name = "alpha2-extensions"
version.workspace = true
description = "Extension providers that supply frames of formats the host decoders do not read: SVG, animated images, Lottie, OpenEXR, image sequences, LaTeX math, PDF pages."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["svg", "lottie", "latex", "openexr", "video"]
categories = ["multimedia::images", "multimedia::video"]
include = [
  "/src/**",
  "/README.md",
  "/LICENSE.md",
  "!/src/**/tests.rs",
  "!/src/**/*_tests.rs",
  "!/src/**/tests/**",
]

[features]
default = ["svg", "animated-image", "image-sequence", "lottie", "exr", "latex", "pdf"]
svg = [
  "dep:resvg",
  "dep:imagesize",
  "dep:flate2",
  "dep:simplecss",
  "dep:svgtypes",
  "dep:kurbo",
  "dep:roxmltree",
  "dep:usvg",
  "dep:tiny-skia",
  "dep:tiny-skia-path",
]
animated-image = ["dep:gif", "dep:image-webp", "dep:png"]
image-sequence = ["dep:png"]
exr = ["dep:exr", "dep:half"]
latex = ["svg", "dep:latex-rust"]
pdf = [
  "svg",
  "dep:hayro-svg",
  "dep:hayro-interpret",
  "dep:hayro-syntax",
  "dep:hayro-jpeg2000",
  "dep:hayro-jbig2",
  "dep:hayro-ccitt",
]
lottie = [
  "dep:velato",
  "dep:kurbo",
  "dep:peniko",
  "dep:resvg",
  "dep:zip",
  "dep:serde_json",
  "dep:png",
  "dep:base64",
  "dep:roxmltree",
  "dep:usvg",
  "dep:tiny-skia",
  "dep:tiny-skia-path",
]

[dependencies]
alpha2-model.workspace = true
alpha2-time.workspace = true
serde.workspace = true
gif = { version = "0.14.2", optional = true, default-features = false, features = ["std"] }
image-webp = { version = "0.2.4", optional = true }
png = { workspace = true, optional = true }
hayro-svg = { version = "=0.9.0", optional = true }
imagesize = { version = "0.14.0", optional = true }
latex-rust = { version = "=3.0.1", optional = true, default-features = false, features = ["std"] }
resvg = { version = "=0.47.0", optional = true, default-features = false, features = ["text", "raster-images"] }
serde_json = { workspace = true, optional = true }
velato = { version = "=0.12.0", optional = true, default-features = false }
kurbo = { version = "=0.13.1", optional = true }
peniko = { version = "0.6.1", optional = true }
base64 = { version = "0.22.1", optional = true }
exr = { version = "=1.74.3", optional = true, default-features = false }
half = { version = "2.6.0", optional = true }
flate2 = { version = "1.1.10", optional = true }
simplecss = { version = "=0.2.2", optional = true }
svgtypes = { version = "=0.16.1", optional = true }
zip = { version = "=9.0.5", optional = true, default-features = false, features = ["deflate"] }
# The cost models are written against these versions of the converters; a pin moves with a re-read.
roxmltree = { version = "=0.21.1", optional = true, default-features = false }
usvg = { version = "=0.47.0", optional = true, default-features = false }
tiny-skia = { version = "=0.12.0", optional = true, default-features = false }
tiny-skia-path = { version = "=0.12.0", optional = true, default-features = false }
hayro-interpret = { version = "=0.9.0", optional = true, default-features = false }
hayro-syntax = { version = "=0.9.0", optional = true, default-features = false }
hayro-jpeg2000 = { version = "=0.5.0", optional = true, default-features = false }
hayro-jbig2 = { version = "=0.4.0", optional = true, default-features = false }
hayro-ccitt = { version = "=0.5.0", optional = true, default-features = false }

[dev-dependencies]
alpha2-scaling-support.workspace = true
serde_json.workspace = true
base64 = "0.22.1"
gif = { version = "0.14.2", default-features = false, features = ["std", "color_quant"] }
png.workspace = true

[lints]
workspace = true
