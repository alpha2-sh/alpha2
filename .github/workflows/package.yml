name: package

# The release packaging, run by release.yml before it publishes and by ci.yml on pushes, the nightly
# schedule and pull requests that touch packaging: the same steps in both, so CI fails where a
# release would.
on:
  workflow_call:
    inputs:
      targets:
        description: JSON list of the release targets to package (linux-x64, linux-arm64, macos-arm64, win-x64)
        type: string
        required: true
      upload-name-prefix:
        description: Prefix of the uploaded artifacts' names
        type: string
        default: ""

permissions:
  contents: read

env:
  # The macOS shims compile for the oldest macOS the archives and wheels claim.
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  package:
    name: Package ${{ matrix.target }}
    runs-on: >-
      ${{ fromJSON('{"linux-x64":"ubuntu-22.04","linux-arm64":"ubuntu-24.04-arm","macos-arm64":"macos-26","win-x64":"windows-2025"}')[matrix.target] }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # A manylinux container has no rustup; the hosted runners do.
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: |
          if ! command -v rustup > /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
              sh -s -- -y --no-modify-path --default-toolchain none --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install

      - run: cargo install cargo-about --version 0.9.2 --locked --features cli

      # On the Ubuntu runners, or as root in a manylinux (AlmaLinux) container, where bindgen also
      # needs libclang.
      - name: Install Linux packaging tools
        if: startsWith(matrix.target, 'linux-')
        run: |
          if command -v dnf > /dev/null; then
            dnf install --assumeyes clang-devel pkgconf-pkg-config unzip
          else
            sudo apt-get update && sudo apt-get install --yes pkg-config unzip
          fi

      - name: Install macOS packaging tools
        if: startsWith(matrix.target, 'macos-')
        run: brew install pkg-config

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Build the native archive
        run: scripts/build-native-release.sh bundled "${{ matrix.target }}"

      # The Python wheels of this target from the archive just built, installed and checked the way
      # the release's distribute job does it: `pip install alpha2` brings the host it pins, and the
      # client finds it.
      - name: Build Python wheels, install them and find the host
        run: |
          pipx install uv==0.9.17
          check="$RUNNER_TEMP/wheel-check"
          scripts/release/build-wheels.sh target/alpha2-native-release/archives/alpha2-*-bundled.* \
            target/python-wheels "$check"
          python="$check/bin/python"
          [ -d "$check/Scripts" ] && python="$check/Scripts/python"
          echo "PYTHON_CHECK=$python" >> "$GITHUB_ENV"

      - name: Build the Node client package
        run: |
          npm ci
          npm run build:js --workspace alpha2
          npm run build --workspace @alpha2-sh/node
          npm pack --workspace @alpha2-sh/node --pack-destination target/npm-pack

      # windows-latest's ANSI code page is 1252: Hangul and the emoji are outside it.
      - name: Install into caches named outside the code page
        if: matrix.target == 'win-x64'
        run: |
          version="$(basename target/alpha2-native-release/archives/alpha2-*-bundled.zip | sed 's/^alpha2-\(.*\)-win-x64-bundled\.zip$/\1/')"
          mirror="$RUNNER_TEMP/mirror"
          mkdir -p "$mirror/v$version"
          cp target/alpha2-native-release/archives/*.zip "$mirror/v$version/"
          (cd "$mirror/v$version" && sha256sum -- *.zip > checksums.sha256)
          node scripts/packaging/serve-mirror.mjs "$mirror" --log "$RUNNER_TEMP/mirror.log" \
            > "$RUNNER_TEMP/mirror.url" &
          for _ in $(seq 50); do [ -s "$RUNNER_TEMP/mirror.url" ] && break; sleep 0.1; done
          node scripts/packaging/unicode-cache-install.mjs "$RUNNER_TEMP/caches" \
            "$(head -1 "$RUNNER_TEMP/mirror.url")" --python "$PYTHON_CHECK"

      - name: Upload the native archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.upload-name-prefix }}alpha2-native-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7
          path: target/alpha2-native-release/archives/*

      - name: Upload the Python wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.upload-name-prefix }}alpha2-python-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7
          path: target/python-wheels/*.whl

      - name: Upload the Node client package for the install journeys
        if: matrix.target == 'linux-x64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.upload-name-prefix }}journeys-node-client
          if-no-files-found: error
          retention-days: 1
          path: target/npm-pack/*.tgz

  # The install journeys start Docker containers, which a job running in a container cannot, so
  # they run on the bare runner from what the linux-x64 package job uploaded.
  journeys:
    name: Install journeys (linux-x64)
    needs: package
    if: ${{ !cancelled() && contains(fromJSON(inputs.targets), 'linux-x64') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.upload-name-prefix }}alpha2-native-linux-x64
          path: ${{ runner.temp }}/journeys

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.upload-name-prefix }}alpha2-python-linux-x64
          path: ${{ runner.temp }}/journeys

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.upload-name-prefix }}journeys-node-client
          path: ${{ runner.temp }}/journeys

      - name: Install journeys in containers
        run: |
          pipx install uv==0.9.17
          node --test scripts/packaging/*.test.mjs
          scripts/packaging/install-journeys.sh "$RUNNER_TEMP/journeys"
