name: ci

on:
  pull_request:
  push:
    branches: [main, "prerelease-v*"]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      jobs:
        description: Job ids to run, comma-separated (empty runs every job)
        type: string
        default: ""
  workflow_call:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  # Oldest macOS the archives and wheels support (ignored elsewhere).
  MACOSX_DEPLOYMENT_TARGET: "11.0"
  # Runners have no GPU, so `auto` would pick the CPU renderer; GPU jobs run on lavapipe.
  ALPHA2_RENDERER: gpu
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  SAVE_RUST_CACHE: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/prerelease-v') }}
  # Pull requests skip the heavy legs. Jobs cannot read env in their own `if`, so job conditions
  # repeat this.
  HEAVY: ${{ github.event_name != 'pull_request' }}

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      native: ${{ steps.areas.outputs.native }}
      js: ${{ steps.areas.outputs.js }}
      e2e: ${{ steps.areas.outputs.e2e }}
      packaging: ${{ steps.areas.outputs.packaging }}
      browser: ${{ steps.areas.outputs.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Areas this change touches
        id: areas
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          native=false js=false e2e=false packaging=false
          if [ "$EVENT" != pull_request ]; then
            native=true js=true e2e=true packaging=true
          else
            while IFS= read -r path; do
              case $path in
                Cargo.toml | Cargo.lock | rust-toolchain.toml | crates/* | bindings/* | extensions/* | \
                  tests/* | release/ffmpeg-lgpl/* | release/openh264/* | scripts/fetch-*.sh | \
                  .github/workflows/ci.yml)
                  native=true ;;
              esac
              case $path in
                packages/* | scripts/* | package.json | package-lock.json) js=true ;;
              esac
              case $path in
                python/* | packages/alpha2-node/* | scripts/run-node-e2e.mjs) e2e=true ;;
              esac
              case $path in
                release/* | scripts/build-native-release.sh | scripts/fetch-ffmpeg-sdk.sh | \
                  scripts/packaging/* | scripts/release/* | python/alpha2-host/* | \
                  python/alpha2/pyproject.toml | python/alpha2/src/alpha2/install.py | \
                  packages/alpha2-node/src/install.ts | packages/alpha2-node/src/archive.ts | \
                  packages/alpha2-node/src/http.ts | Cargo.lock | rust-toolchain.toml | \
                  .github/workflows/package.yml | .github/workflows/release.yml)
                  packaging=true ;;
              esac
            done < <(git diff --name-only "$BASE...HEAD")
            [ "$native" = true ] && js=true && e2e=true
          fi
          {
            echo "native=$native"
            echo "js=$js"
            echo "e2e=$e2e"
            echo "packaging=$packaging"
            echo "browser=$js"
          } | tee -a "$GITHUB_OUTPUT"

  rust-checks:
    if: ${{ !inputs.jobs || contains(format(',{0},', inputs.jobs), ',rust-checks,') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Provenance
        shell: bash
        run: |
          echo "image: $ImageOS $ImageVersion"
          rustc --version
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost
          df -h /
      - name: Install native media build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          libavcodec-dev libavformat-dev libavutil-dev libswresample-dev
          libswscale-dev libasound2-dev pkg-config clang mesa-vulkan-drivers
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          save-if: ${{ env.SAVE_RUST_CACHE }}
      - name: Pin the FFmpeg SDK that the hardware decode shim builds against
        run: |
          sdk_root="$(scripts/fetch-ffmpeg-sdk.sh linux-x64)"
          {
            echo "PKG_CONFIG_PATH=$sdk_root/lib/pkgconfig"
            echo "FFMPEG_PKG_CONFIG_PATH=$sdk_root/lib/pkgconfig"
            echo "FFMPEG_LINK_MODE=dynamic"
            echo "LD_LIBRARY_PATH=$sdk_root/lib"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cargo fmt --check
      - run: cargo metadata --locked --format-version 1 > /dev/null
      - run: npm run lint:rust
      - run: cargo clippy -p alpha2-native --all-targets -- -D warnings
      - run: scripts/check-schema-fresh.sh
      - run: scripts/check-extension-features.sh
      - run: scripts/check-native-features.sh
      - run: cargo bench -p alpha2-eval --bench timeline_evaluation
      - run: cargo bench --workspace --all-features --no-run

  rust-tests:
    if: ${{ !inputs.jobs || contains(format(',{0},', inputs.jobs), ',rust-tests,') }}
    name: Rust tests (--${{ matrix.features }})
    strategy:
      fail-fast: false
      matrix:
        features: [all-features, no-default-features]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ALPHA2_REQUIRE: c-compiler
      ALPHA2_SKIP_LOG: ${{ github.workspace }}/target/skip-log.jsonl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Provenance
        shell: bash
        run: |
          echo "image: $ImageOS $ImageVersion"
          rustc --version
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost
          df -h /
      - name: Install native media build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          libavcodec-dev libavformat-dev libavutil-dev libswresample-dev
          libswscale-dev libasound2-dev pkg-config clang mesa-vulkan-drivers
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.features }}
          cache-bin: false
          save-if: ${{ env.SAVE_RUST_CACHE }}
      - name: Pin the FFmpeg SDK that the hardware decode shim builds against
        run: |
          sdk_root="$(scripts/fetch-ffmpeg-sdk.sh linux-x64)"
          {
            echo "PKG_CONFIG_PATH=$sdk_root/lib/pkgconfig"
            echo "FFMPEG_PKG_CONFIG_PATH=$sdk_root/lib/pkgconfig"
            echo "FFMPEG_LINK_MODE=dynamic"
            echo "LD_LIBRARY_PATH=$sdk_root/lib"
          } >> "$GITHUB_ENV"
      - run: cargo test --workspace --${{ matrix.features }} --no-fail-fast
      - name: Skips this run recorded
        if: always()
        run: node scripts/skip-log-summary.mjs "$ALPHA2_SKIP_LOG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: skip-log-rust-tests-${{ matrix.features }}
          path: ${{ github.workspace }}/target/skip-log.jsonl
          if-no-files-found: ignore

  js:
    if: ${{ !inputs.jobs || contains(format(',{0},', inputs.jobs), ',js,') }}
    needs: release-wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ALPHA2_REQUIRE: wasm
      ALPHA2_SKIP_LOG: ${{ github.workspace }}/target/skip-log.jsonl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Provenance
        shell: bash
        run: |
          echo "image: $ImageOS $ImageVersion"
          rustc --version
      - name: Install native media build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          libavcodec-dev libavformat-dev libavutil-dev libswresample-dev
          libswscale-dev libasound2-dev pkg-config clang mesa-vulkan-drivers
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          save-if: ${{ env.SAVE_RUST_CACHE }}
      - name: Pin the FFmpeg SDK that the hardware decode shim builds against
        run: |
          sdk_root="$(scripts/fetch-ffmpeg-sdk.sh linux-x64)"
          {
            echo "PKG_CONFIG_PATH=$sdk_root/lib/pkgconfig"
            echo "FFMPEG_PKG_CONFIG_PATH=$sdk_root/lib/pkgconfig"
            echo "FFMPEG_LINK_MODE=dynamic"
            echo "LD_LIBRARY_PATH=$sdk_root/lib"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: alpha2-build
          path: packages
      - run: npm run test:js
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:wasm-parity
      - uses: taiki-e/cache-cargo-install-action@9ee83daaa7b96a6fab930949ecf1122bba04a389 # v3.0.8
        with:
          tool: wasm-bindgen-cli@0.2.128
      - run: npm run test:render-determinism
      - run: npm run test:package
      - run: scripts/test-clean-consumers.sh
      - name: Skips this run recorded
        if: always()
        run: node scripts/skip-log-summary.mjs "$ALPHA2_SKIP_LOG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: skip-log-js
          path: ${{ github.workspace }}/target/skip-log.jsonl
          if-no-files-found: ignore

  host:
    if: ${{ !inputs.jobs || contains(format(',{0},', inputs.jobs), ',host,') }}
    needs: release-wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ALPHA2_REQUIRE: wasm,browser,python,host
      ALPHA2_SKIP_LOG: ${{ github.workspace }}/target/skip-log.jsonl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Provenance
        shell: bash
        run: |
          echo "image: $ImageOS $ImageVersion"
          rustc --version
      - name: Install native media build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          libavcodec-dev libavformat-dev libavutil-dev libswresample-dev
          libswscale-dev libasound2-dev pkg-config clang mesa-vulkan-drivers
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          save-if: ${{ env.SAVE_RUST_CACHE }}
      - name: Pin the FFmpeg SDK that the hardware decode shim builds against
        run: |
          sdk_root="$(scripts/fetch-ffmpeg-sdk.sh linux-x64)"
          {
            echo "PKG_CONFIG_PATH=$sdk_root/lib/pkgconfig"
            echo "FFMPEG_PKG_CONFIG_PATH=$sdk_root/lib/pkgconfig"
            echo "FFMPEG_LINK_MODE=dynamic"
            echo "LD_LIBRARY_PATH=$sdk_root/lib"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: alpha2-build
          path: packages
      - name: Build the Python package the parity and end-to-end checks run
        working-directory: python/alpha2
        # --no-deps: the pinned alpha2-host wheel is not published yet; these checks use the host
        # built here.
        run: |
          pipx install uv==0.9.17
          uv venv -p 3.11 .venv
          uv pip install --group dev
          uv pip install --no-deps -e .
      - run: npm run test:host-parity
        env:
          ALPHA2_CHROME_GPU: swiftshader
      - name: A Vulkan device without Vulkan Video falls back to software
        run: |
          set -- /usr/share/vulkan/icd.d/lvp_icd*.json
          icd="$1"
          test -f "$icd"
          VK_ICD_FILENAMES="$icd" \
            target/debug/alpha2-host export \
            --project tests/cases/host-parity-project.json \
            --asset image-source=tests/corpus/cross_topology_parity.png \
            --out "$RUNNER_TEMP/lavapipe.mp4" --no-audio --video-codec mpeg4-part2 \
            2> "$RUNNER_TEMP/lavapipe.log" || { cat "$RUNNER_TEMP/lavapipe.log"; exit 1; }
          grep "hardware decode unavailable, using software" "$RUNNER_TEMP/lavapipe.log"
      - name: Skips this run recorded
        if: always()
        run: node scripts/skip-log-summary.mjs "$ALPHA2_SKIP_LOG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: skip-log-host
          path: ${{ github.workspace }}/target/skip-log.jsonl
          if-no-files-found: ignore

  openh264:
    if: ${{ !inputs.jobs || contains(format(',{0},', inputs.jobs), ',openh264,') }}
    name: OpenH264 (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      ALPHA2_REQUIRE: openh264,c-compiler
      ALPHA2_SKIP_LOG: ${{ github.workspace }}/target/skip-log.jsonl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Provenance
        shell: bash
        run: |
          echo "image: $ImageOS $ImageVersion"
          rustc --version
      - name: Install native media build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          libavcodec-dev libavformat-dev libavutil-dev libswresample-dev
          libswscale-dev libasound2-dev pkg-config clang mesa-vulkan-drivers bzip2
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: openh264
          cache-bin: false
          save-if: ${{ env.SAVE_RUST_CACHE }}
      - name: Pin the FFmpeg SDK
        run: |
          sdk_root="$(scripts/fetch-ffmpeg-sdk.sh ${{ matrix.target }})"
          {
            echo "PKG_CONFIG_PATH=$sdk_root/lib/pkgconfig"
            echo "FFMPEG_PKG_CONFIG_PATH=$sdk_root/lib/pkgconfig"
            echo "FFMPEG_LINK_MODE=dynamic"
            echo "LD_LIBRARY_PATH=$sdk_root/lib"
          } >> "$GITHUB_ENV"
      # Downloaded from Cisco for tests only; never bundled into uploaded artifacts.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openh264
          key: openh264-${{ matrix.target }}-${{ hashFiles('release/openh264/manifest.toml') }}
      - name: Fetch Cisco's OpenH264 binary
        run: |
          library="$(scripts/fetch-openh264.sh ${{ matrix.target }} "$RUNNER_TEMP/openh264")"
          echo "ALPHA2_OPENH264_LIBRARY=$library" >> "$GITHUB_ENV"
      - name: Loader, encoder and sink tests
        run: cargo test --release -p alpha2-native --lib openh264 --no-fail-fast
      - name: Host tests
        run: cargo test --release -p alpha2-host openh264 --no-fail-fast
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The Node client decompresses Cisco's archive to the library the manifest pins
        run: |
          npm run build:js --workspace alpha2
          npm run build --workspace @alpha2-sh/node
          ALPHA2_TEST_OPENH264_ARCHIVE="$(ls "$RUNNER_TEMP"/openh264/*.bz2)" \
            node --test packages/alpha2-node/test/bzip2.test.mjs
      - name: A GPU without an H.264 encoder exports H.264 through OpenH264, the same bytes twice
        run: |
          cargo build --release -p alpha2-host
          set -- /usr/share/vulkan/icd.d/lvp_icd*.json
          python3 - <<'EOF'
          import json
          project = json.load(open("tests/cases/host-parity-complex-project.json"))
          project["settings"].update(width=1920, height=1080)
          json.dump(project, open("/tmp/openh264-project.json", "w"))
          EOF
          for run in first second; do
            VK_ICD_FILENAMES="$1" target/release/alpha2-host export \
              --project /tmp/openh264-project.json \
              --asset video=tests/corpus/parity-rgb.mov --asset still=tests/corpus/parity-image.png \
              --out "$RUNNER_TEMP/$run.mp4" > "$RUNNER_TEMP/$run.json" 2> "$RUNNER_TEMP/$run.log" \
              || { cat "$RUNNER_TEMP/$run.log"; exit 1; }
          done
          python3 - "$RUNNER_TEMP/first.json" <<'EOF'
          import json, sys
          result = json.load(open(sys.argv[1]))["result"]
          assert result["videoEncoder"] == "openh264", result["videoEncoder"]
          assert result["videoEncoderClass"] == "software"
          assert result["videoThreadCount"] == 4, result["videoThreadCount"]
          assert result["frames"] == 36, result["frames"]
          assert result["videoEncoderLibrary"]["provider"] == "cisco-openh264"
          assert not any(f["encoder"].endswith(("_vulkan", "_nvenc")) for f in result["videoEncoderFallbacks"])
          EOF
          cmp "$RUNNER_TEMP/first.mp4" "$RUNNER_TEMP/second.mp4"
      - name: Skips this run recorded
        if: always()
        run: node scripts/skip-log-summary.mjs "$ALPHA2_SKIP_LOG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: skip-log-openh264-${{ matrix.target }}
          path: ${{ github.workspace }}/target/skip-log.jsonl
          if-no-files-found: ignore

  cpu-renderer:
    if: ${{ !inputs.jobs || contains(format(',{0},', inputs.jobs), ',cpu-renderer,') }}
    name: CPU renderer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Provenance
        shell: bash
        run: |
          echo "image: $ImageOS $ImageVersion"
          rustc --version
      - name: Install native media build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          libavcodec-dev libavformat-dev libavutil-dev libswresample-dev
          libswscale-dev libasound2-dev pkg-config clang mesa-vulkan-drivers
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: cpu-renderer
          cache-bin: false
          save-if: ${{ env.SAVE_RUST_CACHE }}
      - name: Pin the FFmpeg SDK
        run: |
          sdk_root="$(scripts/fetch-ffmpeg-sdk.sh linux-x64)"
          {
            echo "PKG_CONFIG_PATH=$sdk_root/lib/pkgconfig"
            echo "FFMPEG_PKG_CONFIG_PATH=$sdk_root/lib/pkgconfig"
            echo "FFMPEG_LINK_MODE=dynamic"
            echo "LD_LIBRARY_PATH=$sdk_root/lib"
          } >> "$GITHUB_ENV"
      - name: Every CPU pass against the GPU's on lavapipe
        run: cargo test --release -p alpha2-render --lib cpu_ --no-fail-fast
      - name: The host suite on the CPU renderer
        env:
          ALPHA2_RENDERER: cpu
        run: cargo test --release -p alpha2-host --no-fail-fast
      - name: Without any graphics driver, and with only lavapipe, auto renders on the CPU
        env:
          ALPHA2_RENDERER: auto
        run: |
          cargo build --release -p alpha2-host
          set -- /usr/share/vulkan/icd.d/lvp_icd*.json
          for case in none lavapipe; do
            if [ "$case" = none ]; then icd=/nonexistent; else icd="$1"; fi
            VK_ICD_FILENAMES="$icd" WGPU_BACKEND=vulkan target/release/alpha2-host export \
              --project tests/cases/host-parity-complex-project.json \
              --asset video=tests/corpus/parity-rgb.mov --asset still=tests/corpus/parity-image.png \
              --no-audio --video-codec mpeg4-part2 --out "$RUNNER_TEMP/$case.mp4" \
              > "$RUNNER_TEMP/$case.json" 2> "$RUNNER_TEMP/$case.log" \
              || { cat "$RUNNER_TEMP/$case.log"; exit 1; }
            python3 - "$RUNNER_TEMP/$case.json" <<'EOF'
          import json, sys
          result = json.load(open(sys.argv[1]))["result"]
          assert result["renderer"] == "cpu", result["renderer"]
          assert result["rendererReason"], result
          assert result["frames"] == 36, result["frames"]
          EOF
          done

  wasm-audio:
    if: >-
      ${{ !inputs.jobs || contains(format(',{0},', inputs.jobs), ',wasm-audio,') ||
      contains(format(',{0},', inputs.jobs), ',host,') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Provenance
        shell: bash
        run: |
          echo "image: $ImageOS $ImageVersion"
          rustc --version
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          save-if: ${{ env.SAVE_RUST_CACHE }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: cargo build -p alpha2-wasm --target wasm32-unknown-unknown
      - run: cargo build -p alpha2-audio-worklet --target wasm32-unknown-unknown
      - run: npm run test:audio-determinism

  msrv:
    if: ${{ !inputs.jobs || contains(format(',{0},', inputs.jobs), ',msrv,') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Provenance
        shell: bash
        run: |
          echo "image: $ImageOS $ImageVersion"
          rustc --version
      - name: Install native media build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          libavcodec-dev libavformat-dev libavutil-dev libswresample-dev
          libswscale-dev libasound2-dev pkg-config clang
      - name: Install the rust-version toolchain
        run: |
          msrv="$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)"
          test -n "$msrv"
          rustup toolchain install "$msrv" --profile minimal
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          save-if: ${{ env.SAVE_RUST_CACHE }}
      - name: Pin the FFmpeg SDK that the hardware decode shim builds against
        run: |
          sdk_root="$(scripts/fetch-ffmpeg-sdk.sh linux-x64)"
          {
            echo "PKG_CONFIG_PATH=$sdk_root/lib/pkgconfig"
            echo "FFMPEG_PKG_CONFIG_PATH=$sdk_root/lib/pkgconfig"
            echo "FFMPEG_LINK_MODE=dynamic"
            echo "LD_LIBRARY_PATH=$sdk_root/lib"
          } >> "$GITHUB_ENV"
      - run: cargo "+$MSRV" check --workspace --all-targets --all-features

  valgrind:
    if: ${{ !inputs.jobs || contains(format(',{0},', inputs.jobs), ',valgrind,') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Provenance
        shell: bash
        run: |
          echo "image: $ImageOS $ImageVersion"
          rustc --version
      - name: Install native media build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          libavcodec-dev libavformat-dev libavutil-dev libswresample-dev
          libswscale-dev libasound2-dev pkg-config clang valgrind libvulkan-dev
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          save-if: ${{ env.SAVE_RUST_CACHE }}
      - name: Pin the FFmpeg SDK the bridge builds against
        run: |
          sdk_root="$(scripts/fetch-ffmpeg-sdk.sh linux-x64)"
          {
            echo "PKG_CONFIG_PATH=$sdk_root/lib/pkgconfig"
            echo "FFMPEG_PKG_CONFIG_PATH=$sdk_root/lib/pkgconfig"
            echo "FFMPEG_LINK_MODE=dynamic"
            echo "LD_LIBRARY_PATH=$sdk_root/lib"
          } >> "$GITHUB_ENV"
      - name: Bridge and native binding tests under valgrind
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: valgrind --error-exitcode=9 --quiet
          ALPHA2_TEST_DECODE_WORK_LIMIT_MS: "600000"
          # SVT-AV1 in the SDK's libavcodec reads uninitialized memory in its own threads.
          ALPHA2_TEST_SKIP_ENCODERS: libsvtav1
        run: cargo test -p alpha2-ffmpeg-bridge -p alpha2-native --features alpha2-ffmpeg-bridge/hwdevice --lib --bins --tests --no-fail-fast
      - name: GPU timeout configuration under ThreadSanitizer
        run: bash scripts/test-gpu-timeout-race.sh

  wasm-lint:
    if: ${{ !inputs.jobs || contains(format(',{0},', inputs.jobs), ',wasm-lint,') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Provenance
        shell: bash
        run: |
          echo "image: $ImageOS $ImageVersion"
          rustc --version
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          save-if: ${{ env.SAVE_RUST_CACHE }}
      - run: >-
          cargo clippy -p alpha2-wasm -p alpha2-audio-worklet
          --target wasm32-unknown-unknown -- -D warnings

  fuzz-check:
    if: ${{ !inputs.jobs || contains(format(',{0},', inputs.jobs), ',fuzz-check,') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Provenance
        shell: bash
        run: |
          echo "image: $ImageOS $ImageVersion"
          rustc --version
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
          cache-bin: false
          save-if: ${{ env.SAVE_RUST_CACHE }}
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --check
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --locked --bins -- -D warnings

  platform-lint:
    if: ${{ !inputs.jobs || contains(format(',{0},', inputs.jobs), ',platform-lint,') }}
    name: Platform lint (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-26
          - target: win-x64
            runner: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Provenance
        shell: bash
        run: |
          echo "image: $ImageOS $ImageVersion"
          rustc --version
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          save-if: ${{ env.SAVE_RUST_CACHE }}
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install pkg-config
      - name: Pin the FFmpeg SDK
        run: |
          sdk_root="$(scripts/fetch-ffmpeg-sdk.sh ${{ matrix.target }})"
          if [ "${{ runner.os }}" = Windows ]; then
            sdk_root="$(cygpath -m "$sdk_root")"
            {
              echo "FFMPEG_INCLUDE_DIR=$sdk_root/include"
              echo "FFMPEG_LIBS_DIR=$sdk_root/lib"
              echo "FFMPEG_LINK_MODE=dynamic"
            } >> "$GITHUB_ENV"
            echo "$sdk_root/bin" >> "$GITHUB_PATH"
          else
            {
              echo "PKG_CONFIG_PATH=$sdk_root/lib/pkgconfig"
              echo "FFMPEG_PKG_CONFIG_PATH=$sdk_root/lib/pkgconfig"
              echo "FFMPEG_LINK_MODE=dynamic"
            } >> "$GITHUB_ENV"
            if [ "${{ runner.os }}" = Linux ]; then
              echo "LD_LIBRARY_PATH=$sdk_root/lib" >> "$GITHUB_ENV"
            fi
          fi
      # The Windows host refuses to start without the pinned DXC.
      - if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dxc
          key: dxc-${{ hashFiles('release/dxc/manifest.toml') }}
      - name: Fetch the pinned DXC
        if: runner.os == 'Windows'
        run: echo "ALPHA2_DXC_PATH=$(scripts/fetch-dxc.sh "$RUNNER_TEMP/dxc")" >> "$GITHUB_ENV"
      - name: Clippy of the native crates
        run: >-
          cargo clippy -p alpha2-native -p alpha2-native-gpu -p alpha2-host -p alpha2-ffmpeg-bridge
          -p alpha2-os -p alpha2-build-support --all-features --all-targets -- -D warnings
      - run: scripts/check-native-features.sh
      - name: Install the rust-version toolchain
        run: |
          msrv="$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)"
          test -n "$msrv"
          rustup toolchain install "$msrv" --profile minimal
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
      - name: The native crates build with the rust-version toolchain
        run: >-
          cargo "+$MSRV" check -p alpha2-native -p alpha2-native-gpu -p alpha2-host
          -p alpha2-ffmpeg-bridge -p alpha2-os -p alpha2-build-support --all-targets --all-features
      - name: The benches build
        run: cargo bench --no-run -p alpha2-render -p alpha2-native
      - name: Link and start the host
        run: |
          cargo build -p alpha2-host
          { target/debug/alpha2-host 2>&1 || true; } | grep "usage: alpha2-host"
      - name: The Windows host reports DXC
        if: runner.os == 'Windows'
        run: |
          echo '{"protocolVersion":1,"requestId":"c","operation":"capabilities"}' \
            | ALPHA2_RENDERER=gpu target/debug/alpha2-host serve > "$RUNNER_TEMP/capabilities.json"
          python - "$RUNNER_TEMP/capabilities.json" <<'PY'
          import json, sys
          lines = [json.loads(line) for line in open(sys.argv[1]).read().splitlines() if line]
          answer = next(line for line in lines if line.get("requestId") == "c")
          compiler = answer["result"]["capabilities"]["gpu"]["shaderCompiler"]
          assert compiler.startswith("DXC"), compiler
          print(compiler)
          PY

  mobile-lint:
    if: >-
      ${{ (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',mobile-lint,')) &&
      needs.changes.outputs.native == 'true' }}
    name: Mobile lint (${{ matrix.platform }})
    needs: changes
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # The runner's NDK must stay installed, so this job has no disk cleanup step.
          - platform: android
            runner: ubuntu-24.04
            targets: aarch64-linux-android x86_64-linux-android
          # Crates with Apple SDK build steps need Xcode's iOS SDKs.
          - platform: ios
            runner: macos-26
            targets: aarch64-apple-ios aarch64-apple-ios-sim
    defaults:
      run:
        shell: bash
    env:
      # The mobile crate set: everything an app links. FFmpeg-linked crates are desktop only.
      MOBILE_PACKAGES: -p alpha2-os -p alpha2-native-gpu -p alpha2-extensions -p alpha2-text
        -p alpha2-host-core -p alpha2-container -p alpha2-backend-conformance
        -p alpha2-android-media -p alpha2-apple-media -p alpha2-mobile
      MOBILE_ALL_FEATURE_PACKAGES: -p alpha2 -p alpha2-compose -p alpha2-host-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Provenance
        run: |
          echo "image: $ImageOS $ImageVersion"
          rustc --version
          if [ "${{ matrix.platform }}" = ios ]; then xcodebuild -version; fi
      - name: Install the pinned Rust toolchain and the mobile targets
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.platform }}
          cache-bin: false
          save-if: ${{ env.SAVE_RUST_CACHE }}
      - name: Point Cargo at the NDK toolchain (API 29)
        if: matrix.platform == 'android'
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:?}"
          cat "$ndk/source.properties"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          sysroot="$ndk/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          for target in ${{ matrix.targets }}; do
            var="${target//-/_}"
            upper="${var^^}"
            {
              echo "CC_$var=$bin/${target}29-clang"
              echo "CXX_$var=$bin/${target}29-clang++"
              echo "AR_$var=$bin/llvm-ar"
              echo "CARGO_TARGET_${upper}_LINKER=$bin/${target}29-clang"
              echo "BINDGEN_EXTRA_CLANG_ARGS_$var=--sysroot=$sysroot"
            } >> "$GITHUB_ENV"
          done
      - name: Clippy of the mobile crate set
        run: |
          for target in ${{ matrix.targets }}; do
            echo "::group::$target"
            cargo clippy --locked $MOBILE_PACKAGES --all-targets --target "$target" -- -D warnings
            cargo clippy --locked $MOBILE_ALL_FEATURE_PACKAGES --all-features --all-targets \
              --target "$target" -- -D warnings
            echo "::endgroup::"
          done

  mobile-test:
    if: >-
      ${{ (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',mobile-test,')) &&
      needs.changes.outputs.native == 'true' }}
    name: Mobile tests (Android ${{ matrix.api }} emulator)
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported release, whose emulator image has GL only, and a current one.
        api: [29, 36]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Provenance
        run: |
          echo "image: $ImageOS $ImageVersion"
          rustc --version
      - name: Install the pinned Rust toolchain and the emulator target
        run: |
          rustup toolchain install
          rustup target add x86_64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: mobile-test
          cache-bin: false
          save-if: ${{ env.SAVE_RUST_CACHE }}
      - name: Point Cargo at the NDK toolchain (API 29)
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:?}"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "CC_x86_64_linux_android=$bin/x86_64-linux-android29-clang"
            echo "CXX_x86_64_linux_android=$bin/x86_64-linux-android29-clang++"
            echo "AR_x86_64_linux_android=$bin/llvm-ar"
            echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$bin/x86_64-linux-android29-clang"
            echo "BINDGEN_EXTRA_CLANG_ARGS_x86_64_linux_android=--sysroot=$ndk/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          } >> "$GITHUB_ENV"
      - name: Build the test binaries
        run: |
          mkdir -p target/mobile-tests
          cargo test --locked --no-run --target x86_64-linux-android \
            -p alpha2-android-media -p alpha2-mobile --lib --message-format=json |
            jq -r 'select(.reason == "compiler-artifact" and .executable != null) | .executable' |
            xargs -I{} cp {} target/mobile-tests/
          ls -la target/mobile-tests
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The suites test the backends' logic on the emulator's software codecs and GPU; hardware
      # codecs are covered on devices. Debug builds name GPU objects, which the emulator's Vulkan
      # driver crashes on, so the tests run without wgpu's debug flag.
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          script: |
            adb shell mkdir -p /data/local/tmp/alpha2-test/tests
            adb push tests/corpus tests/cases tests/fonts /data/local/tmp/alpha2-test/tests/ > /dev/null
            adb push target/mobile-tests/. /data/local/tmp/alpha2-test/ > /dev/null
            for binary in target/mobile-tests/*; do name=$(basename "$binary"); adb shell "cd /data/local/tmp/alpha2-test && chmod 755 $name && ALPHA2_TESTS_DIR=/data/local/tmp/alpha2-test/tests TMPDIR=/data/local/tmp/alpha2-test WGPU_DEBUG=0 ./$name --test-threads 1" || exit 1; done

  mobile-test-ios:
    if: >-
      ${{ (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',mobile-test-ios,')) &&
      needs.changes.outputs.native == 'true' }}
    name: Mobile tests (iOS simulator)
    needs: changes
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Provenance
        run: |
          echo "image: $ImageOS $ImageVersion"
          rustc --version
          xcodebuild -version
      - name: Install the pinned Rust toolchain and the simulator target
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: mobile-test-ios
          cache-bin: false
          save-if: ${{ env.SAVE_RUST_CACHE }}
      - name: Boot a simulator
        run: |
          device=$(xcrun simctl list devices available -j |
            jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | test("iPhone"))][0].udid')
          echo "SIMULATOR=$device" >> "$GITHUB_ENV"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device"
      # The suites test the backends' logic; the simulator's codecs are software and its GPU path
      # is not exercised (wgpu hits a Metal validation assert there), so the session suite runs on
      # the CPU renderer's paths only where it chooses one.
      - name: The Apple media suite in the simulator
        run: |
          cargo test --locked --no-run --target aarch64-apple-ios-sim -p alpha2-apple-media --lib \
            --message-format=json |
            jq -r 'select(.reason == "compiler-artifact" and .executable != null) | .executable' |
            while read -r binary; do
              SIMCTL_CHILD_ALPHA2_TESTS_DIR="$PWD/tests" xcrun simctl spawn "$SIMULATOR" "$binary" --test-threads 1
            done
      - name: The Swift package in the simulator
        run: |
          scripts/build-ios.sh
          cd packages/alpha2-swift
          xcodebuild test -scheme Alpha2 -destination "platform=iOS Simulator,id=$SIMULATOR"

  platform-js:
    if: >-
      ${{ (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',platform-js,')) &&
      needs.changes.outputs.js == 'true' }}
    name: JavaScript tests (${{ matrix.runner }})
    needs: [changes, release-wasm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, windows-2025]
    defaults:
      run:
        shell: bash
    env:
      ALPHA2_REQUIRE: wasm
      ALPHA2_SKIP_LOG: ${{ github.workspace }}/target/skip-log.jsonl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Provenance
        shell: bash
        run: |
          echo "image: $ImageOS $ImageVersion"
          rustc --version
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: alpha2-build
          path: packages
      - run: npm run test:js
      - name: Skips this run recorded
        if: always()
        run: node scripts/skip-log-summary.mjs "$ALPHA2_SKIP_LOG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: skip-log-platform-js-${{ matrix.runner }}
          path: ${{ github.workspace }}/target/skip-log.jsonl
          if-no-files-found: ignore

  platform-native:
    if: >-
      ${{ (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',platform-native,')) &&
      needs.changes.outputs.native == 'true' }}
    name: Native tests (${{ matrix.target }}, software adapter)
    needs: changes
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-26
            require: openh264,c-compiler
          - target: win-x64
            runner: windows-2025
            require: openh264,dxc
    defaults:
      run:
        shell: bash
    env:
      ALPHA2_REQUIRE: ${{ matrix.require }}
      ALPHA2_SKIP_LOG: ${{ github.workspace }}/target/skip-log.jsonl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Provenance
        shell: bash
        run: |
          echo "image: $ImageOS $ImageVersion"
          rustc --version
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          save-if: ${{ env.SAVE_RUST_CACHE }}
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install pkg-config
      - name: Pin the FFmpeg SDK
        run: |
          sdk_root="$(scripts/fetch-ffmpeg-sdk.sh ${{ matrix.target }})"
          if [ "${{ runner.os }}" = Windows ]; then
            sdk_root="$(cygpath -m "$sdk_root")"
            {
              echo "FFMPEG_INCLUDE_DIR=$sdk_root/include"
              echo "FFMPEG_LIBS_DIR=$sdk_root/lib"
              echo "FFMPEG_LINK_MODE=dynamic"
            } >> "$GITHUB_ENV"
            echo "$sdk_root/bin" >> "$GITHUB_PATH"
          else
            {
              echo "PKG_CONFIG_PATH=$sdk_root/lib/pkgconfig"
              echo "FFMPEG_PKG_CONFIG_PATH=$sdk_root/lib/pkgconfig"
              echo "FFMPEG_LINK_MODE=dynamic"
            } >> "$GITHUB_ENV"
            if [ "${{ runner.os }}" = Linux ]; then
              echo "LD_LIBRARY_PATH=$sdk_root/lib" >> "$GITHUB_ENV"
            fi
          fi
      # The Windows host refuses to start without the pinned DXC.
      - if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dxc
          key: dxc-${{ hashFiles('release/dxc/manifest.toml') }}
      - name: Fetch the pinned DXC
        if: runner.os == 'Windows'
        run: echo "ALPHA2_DXC_PATH=$(scripts/fetch-dxc.sh "$RUNNER_TEMP/dxc")" >> "$GITHUB_ENV"
      # Downloaded from Cisco for tests only.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openh264
          key: openh264-${{ matrix.target }}-${{ hashFiles('release/openh264/manifest.toml') }}
      - name: Fetch Cisco's OpenH264 binary
        run: |
          library="$(scripts/fetch-openh264.sh ${{ matrix.target }} "$RUNNER_TEMP/openh264")"
          echo "ALPHA2_OPENH264_LIBRARY=$library" >> "$GITHUB_ENV"
      - name: Adapters
        run: cargo run -q -p alpha2-gpu --example adapters
      - name: Native and host tests (debug)
        run: >-
          cargo test --locked --all-features --no-fail-fast -p alpha2-os -p alpha2-build-support
          -p alpha2-ffmpeg-bridge -p alpha2-native -p alpha2-native-gpu -p alpha2-gpu -p alpha2-host
      - name: Native and host tests (release, strict GPU errors)
        if: ${{ !cancelled() && env.HEAVY == 'true' }}
        env:
          ALPHA2_GPU_STRICT: "1"
        run: >-
          cargo test --locked --release --all-features --no-fail-fast -p alpha2-os
          -p alpha2-build-support -p alpha2-ffmpeg-bridge -p alpha2-native -p alpha2-native-gpu
          -p alpha2-gpu -p alpha2-host
      - name: H.264 goes through OpenH264, the same bytes twice
        if: ${{ !cancelled() }}
        run: |
          cargo build --release -p alpha2-host
          node -e '
            const fs = require("node:fs");
            const project = JSON.parse(fs.readFileSync("tests/cases/host-parity-complex-project.json", "utf8"));
            Object.assign(project.settings, { width: 1920, height: 1080 });
            fs.writeFileSync(process.argv[1], JSON.stringify(project));
          ' "$RUNNER_TEMP/openh264-project.json"
          # These runners also have a platform H.264 encoder, which the host would prefer.
          for run in first second; do
            target/release/alpha2-host export --project "$RUNNER_TEMP/openh264-project.json" \
              --asset video=tests/corpus/parity-rgb.mov --asset still=tests/corpus/parity-image.png \
              --video-encoder openh264 \
              --out "$RUNNER_TEMP/$run.mp4" > "$RUNNER_TEMP/$run.json" 2> "$RUNNER_TEMP/$run.log" \
              || { cat "$RUNNER_TEMP/$run.log"; exit 1; }
          done
          node -e '
            const { result } = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            const check = (ok, what) => { if (!ok) throw new Error(what + ": " + JSON.stringify(result)); };
            check(result.videoEncoder === "openh264", "videoEncoder");
            check(result.videoEncoderClass === "software", "videoEncoderClass");
            check(result.frames === 36, "frames");
            check(result.videoEncoderLibrary.provider === "cisco-openh264", "provider");
          ' "$RUNNER_TEMP/first.json"
          cmp "$RUNNER_TEMP/first.mp4" "$RUNNER_TEMP/second.mp4"
      - name: Skips this run recorded
        if: always()
        run: node scripts/skip-log-summary.mjs "$ALPHA2_SKIP_LOG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: skip-log-platform-native-${{ matrix.target }}
          path: ${{ github.workspace }}/target/skip-log.jsonl
          if-no-files-found: ignore

  platform-e2e:
    if: >-
      ${{ (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',platform-e2e,')) &&
      needs.changes.outputs.e2e == 'true' }}
    name: End-to-end clients (${{ matrix.target }})
    needs: [changes, release-wasm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: macos-arm64
            runner: macos-26
          - target: win-x64
            runner: windows-2025
    defaults:
      run:
        shell: bash
    env:
      ALPHA2_RENDERER: cpu
      ALPHA2_REQUIRE: python,host
      ALPHA2_SKIP_LOG: ${{ github.workspace }}/target/skip-log.jsonl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Provenance
        shell: bash
        run: |
          echo "image: $ImageOS $ImageVersion"
          rustc --version
      - name: Install native media build dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          libasound2-dev pkg-config clang
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          save-if: ${{ env.SAVE_RUST_CACHE }}
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install pkg-config
      - name: Pin the FFmpeg SDK
        run: |
          sdk_root="$(scripts/fetch-ffmpeg-sdk.sh ${{ matrix.target }})"
          if [ "${{ runner.os }}" = Windows ]; then
            sdk_root="$(cygpath -m "$sdk_root")"
            {
              echo "FFMPEG_INCLUDE_DIR=$sdk_root/include"
              echo "FFMPEG_LIBS_DIR=$sdk_root/lib"
              echo "FFMPEG_LINK_MODE=dynamic"
            } >> "$GITHUB_ENV"
            echo "$sdk_root/bin" >> "$GITHUB_PATH"
          else
            {
              echo "PKG_CONFIG_PATH=$sdk_root/lib/pkgconfig"
              echo "FFMPEG_PKG_CONFIG_PATH=$sdk_root/lib/pkgconfig"
              echo "FFMPEG_LINK_MODE=dynamic"
            } >> "$GITHUB_ENV"
            if [ "${{ runner.os }}" = Linux ]; then
              echo "LD_LIBRARY_PATH=$sdk_root/lib" >> "$GITHUB_ENV"
            fi
          fi
      # The Windows host refuses to start without the pinned DXC.
      - if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dxc
          key: dxc-${{ hashFiles('release/dxc/manifest.toml') }}
      - name: Fetch the pinned DXC
        if: runner.os == 'Windows'
        run: echo "ALPHA2_DXC_PATH=$(scripts/fetch-dxc.sh "$RUNNER_TEMP/dxc")" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: alpha2-build
          path: packages
      - name: Build the host and the Python package
        run: |
          cargo build -p alpha2-host
          cd python/alpha2
          pipx install uv==0.9.17
          uv venv -p 3.11 .venv
          uv pip install --group dev
          uv pip install --no-deps -e .
          if [ -d .venv/Scripts ]; then echo "PY=$PWD/.venv/Scripts" >> "$GITHUB_ENV"; else echo "PY=$PWD/.venv/bin" >> "$GITHUB_ENV"; fi
      - run: npm run test:node-e2e
      - name: Python end-to-end tests
        if: ${{ !cancelled() }}
        env:
          ALPHA2_HOST_BINARY: ${{ github.workspace }}/target/debug/alpha2-host${{ runner.os == 'Windows' && '.exe' || '' }}
        run: '"$PY/pytest" python/alpha2/tests/test_e2e.py python/alpha2/tests/test_scenes.py'
      - name: Skips this run recorded
        if: always()
        run: node scripts/skip-log-summary.mjs "$ALPHA2_SKIP_LOG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: skip-log-platform-e2e-${{ matrix.target }}
          path: ${{ github.workspace }}/target/skip-log.jsonl
          if-no-files-found: ignore

  python:
    if: ${{ !inputs.jobs || contains(format(',{0},', inputs.jobs), ',python,') }}
    name: Python package (${{ matrix.runner }}, ${{ matrix.python }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-26, windows-2025]
        python: ["3.11", "3.15"]
    defaults:
      run:
        shell: bash
        working-directory: python/alpha2
    env:
      ALPHA2_REQUIRE: ""
      ALPHA2_SKIP_LOG: ${{ github.workspace }}/target/skip-log.jsonl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Provenance
        shell: bash
        run: |
          echo "image: $ImageOS $ImageVersion"
          rustc --version
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          save-if: ${{ env.SAVE_RUST_CACHE }}
      # The abi3 module targets 3.11 (the oldest supported) and is tested on the newest too. uv
      # 0.13.3 is the first uv that installs CPython 3.15.0.
      - name: Build the package into a Python ${{ matrix.python }} environment
        run: |
          pipx install uv==0.13.3
          uv venv -p ${{ matrix.python }} .venv
          uv pip install --group dev
          uv pip install --no-deps -e .
          if [ -d .venv/Scripts ]; then echo "PY=.venv/Scripts" >> "$GITHUB_ENV"; else echo "PY=.venv/bin" >> "$GITHUB_ENV"; fi
      - if: runner.os == 'Linux' && matrix.python == '3.11'
        run: |
          "$PY/ruff" check src tests ../alpha2-host
          "$PY/ruff" format --check src tests ../alpha2-host
          "$PY/mypy"
          "$PY/mypy" --platform win32
          "$PY/mypy" --platform darwin
      # No host here, so the end-to-end tests skip; the host job runs them.
      - run: '"$PY/pytest"'
      - name: Skips this run recorded
        if: always()
        working-directory: ${{ github.workspace }}
        run: node scripts/skip-log-summary.mjs "$ALPHA2_SKIP_LOG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: skip-log-python-${{ matrix.runner }}-${{ matrix.python }}
          path: ${{ github.workspace }}/target/skip-log.jsonl
          if-no-files-found: ignore

  determinism:
    if: ${{ !inputs.jobs || contains(format(',{0},', inputs.jobs), ',determinism,') }}
    name: Determinism pins (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-22.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-arm64
            runner: macos-26
          - target: win-x64
            runner: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Provenance
        shell: bash
        run: |
          echo "image: $ImageOS $ImageVersion"
          rustc --version
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          save-if: ${{ env.SAVE_RUST_CACHE }}
      - run: cargo test -p alpha2-audio -p alpha2-audio-determinism -p alpha2-eval -p alpha2-text --no-fail-fast
      - name: CPU renderer frames (no GPU needed)
        run: cargo test -p alpha2-render --lib cpu_determinism --no-fail-fast
      - name: CPU renderer pins and extension rasters
        run: cargo test -p alpha2-render-determinism -p alpha2-extension-raster-pins --no-fail-fast

  security:
    if: ${{ !inputs.jobs || contains(format(',{0},', inputs.jobs), ',security,') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Provenance
        shell: bash
        run: |
          echo "image: $ImageOS $ImageVersion"
          rustc --version
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  release-wasm:
    if: >-
      ${{ !inputs.jobs || contains(format(',{0},', inputs.jobs), ',release-wasm,') ||
      contains(format(',{0},', inputs.jobs), ',js,') || contains(format(',{0},', inputs.jobs), ',host,') ||
      contains(format(',{0},', inputs.jobs), ',browser,') ||
      contains(format(',{0},', inputs.jobs), ',platform-js,') ||
      contains(format(',{0},', inputs.jobs), ',platform-e2e,') ||
      contains(format(',{0},', inputs.jobs), ',browser-platforms,') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Provenance
        shell: bash
        run: |
          echo "image: $ImageOS $ImageVersion"
          rustc --version
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      # A release tag publishes the npm packages built here, so tags build without caches.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          cache-bin: false
          save-if: ${{ env.SAVE_RUST_CACHE }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: taiki-e/cache-cargo-install-action@9ee83daaa7b96a6fab930949ecf1122bba04a389 # v3.0.8
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          tool: wasm-bindgen-cli@0.2.128
      - uses: taiki-e/cache-cargo-install-action@9ee83daaa7b96a6fab930949ecf1122bba04a389 # v3.0.8
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          tool: cargo-about@0.9.2
          features: cli
      - if: startsWith(github.ref, 'refs/tags/')
        run: |
          cargo install wasm-bindgen-cli --version 0.2.128 --locked
          cargo install cargo-about --version 0.9.2 --locked --features cli
      - run: npm run build
      - name: Pack the npm packages
        run: |
          mkdir -p target/npm-release
          npm pack --workspaces --pack-destination target/npm-release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alpha2-npm-packages
          if-no-files-found: error
          path: target/npm-release/*.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alpha2-build
          if-no-files-found: error
          path: |
            packages/*/dist
            packages/*/wasm

  render-goldens:
    if: ${{ !inputs.jobs || contains(format(',{0},', inputs.jobs), ',render-goldens,') }}
    name: Render goldens (${{ matrix.backend }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: vulkan
            runner: ubuntu-24.04
          - backend: gl
            runner: ubuntu-24.04
          - backend: dx12
            runner: windows-2025
            # Debug builds compile the same optimized HLSL as release, so this covers release too.
            strict: "1"
          - backend: metal
            runner: macos-26
    env:
      WGPU_BACKEND: ${{ matrix.backend }}
      LIBGL_ALWAYS_SOFTWARE: "1"
      WGPU_VALIDATION: "1"
      MTL_DEBUG_LAYER: "1"
      ALPHA2_GPU_STRICT: ${{ matrix.strict || '0' }}
      # Reports wgpu-hal validation output without failing.
      ALPHA2_VALIDATION_REPORT: ${{ github.workspace }}/target/validation-report.jsonl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Provenance
        shell: bash
        run: |
          echo "image: $ImageOS $ImageVersion"
          rustc --version
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          save-if: ${{ env.SAVE_RUST_CACHE }}
      - name: Install Mesa software GPU drivers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libegl1 libegl-mesa0 mesa-vulkan-drivers
      - name: Install the D3D12 debug layer
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-WindowsCapability -Online -Name "Tools.Graphics.DirectX~~~~0.0.1.0"
      - if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dxc
          key: dxc-${{ hashFiles('release/dxc/manifest.toml') }}
      - name: Fetch the pinned DXC
        if: runner.os == 'Windows'
        shell: bash
        run: echo "ALPHA2_DXC_PATH=$(scripts/fetch-dxc.sh "$RUNNER_TEMP/dxc")" >> "$GITHUB_ENV"
      - name: Adapters
        shell: bash
        run: cargo run -q -p alpha2-gpu --example adapters
      - name: Run render goldens and engine frame tests on ${{ matrix.backend }}
        env:
          ALPHA2_GOLDEN_ACTUAL_DIR: ${{ github.workspace }}/target/golden-actual/f16
        run: cargo test -p alpha2-render -p alpha2-engine --no-fail-fast -- --test-threads=1
      - name: Run render goldens and engine frame tests on the 8-bit intermediate on ${{ matrix.backend }}
        if: ${{ !cancelled() }}
        env:
          ALPHA2_TEST_INTERMEDIATE: rgba8unorm
          ALPHA2_GOLDEN_ACTUAL_DIR: ${{ github.workspace }}/target/golden-actual/rgba8
        run: cargo test -p alpha2-render --lib -p alpha2-engine --no-fail-fast -- --test-threads=1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: golden-actual-${{ matrix.backend }}
          path: target/golden-actual
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: validation-report-${{ matrix.backend }}
          path: target/validation-report.jsonl
          if-no-files-found: ignore

  browser:
    if: ${{ !inputs.jobs || contains(format(',{0},', inputs.jobs), ',browser,') }}
    needs: release-wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ALPHA2_REQUIRE: browser,wasm,webgpu,webgl2,webcodecs-audio,webcodecs-video
      ALPHA2_SKIP_LOG: ${{ github.workspace }}/target/skip-log.jsonl
      ALPHA2_CHROME_GPU: swiftshader
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Provenance
        shell: bash
        run: |
          echo "image: $ImageOS $ImageVersion"
          rustc --version
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          save-if: ${{ env.SAVE_RUST_CACHE }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: alpha2-build
          path: packages
      - run: npm run test:wgsl-browser
      - run: node scripts/test-wasm-browser.mjs
      - run: npm run test:editor:package
      - name: The wasm-browser cases in Firefox (the image's Firefox and geckodriver)
        if: ${{ !cancelled() }}
        # This Firefox has no WebGPU, WebGL2 or H.264 here, so those cases skip.
        env:
          ALPHA2_REQUIRE: browser,wasm
        run: node scripts/test-wasm-browser.mjs --browser firefox
      - name: With no GPU in the browser, auto renders on the CPU (page and worker)
        if: ${{ !cancelled() }}
        env:
          ALPHA2_CHROME_GPU: none
          ALPHA2_REQUIRE: browser,wasm
        run: |
          node scripts/test-wasm-browser.mjs --case renderer-auto
          node scripts/test-wasm-browser.mjs --case renderer-auto-worker
      - name: Skips this run recorded
        if: always()
        run: node scripts/skip-log-summary.mjs "$ALPHA2_SKIP_LOG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: skip-log-browser
          path: ${{ github.workspace }}/target/skip-log.jsonl
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-reports-linux
          path: |
            target/browser-reports
            target/editor-reports
          if-no-files-found: ignore

  browser-platforms:
    # Software adapters only (paravirtual Metal on macOS, WARP on Windows), not real-GPU runs.
    if: >-
      ${{ (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',browser-platforms,')) &&
      github.event_name != 'pull_request' }}
    name: ${{ matrix.name }}
    needs: release-wasm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Browser (macOS VM Metal, software adapter)
            runner: macos-26
            key: macos
          - name: Browser (Windows WARP, software adapter)
            runner: windows-2025
            key: windows
    defaults:
      run:
        shell: bash
    env:
      ALPHA2_CHROME_GPU: machine
      ALPHA2_REQUIRE: browser,wasm
      ALPHA2_SKIP_LOG: ${{ github.workspace }}/target/skip-log.jsonl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Provenance
        shell: bash
        run: |
          echo "image: $ImageOS $ImageVersion"
          rustc --version
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: alpha2-build
          path: packages
      - run: npm run test:wgsl-browser
      - run: node scripts/test-wasm-browser.mjs
        if: ${{ !cancelled() }}
      - run: npm run test:editor:package
        if: ${{ !cancelled() }}
      - name: The same in Edge
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: |
          node scripts/test-wgsl-browser.mjs --browser edge
          node scripts/test-wasm-browser.mjs --browser edge
      - name: With no GPU in the browser, auto renders on the CPU (page and worker)
        if: ${{ !cancelled() }}
        env:
          ALPHA2_CHROME_GPU: none
          ALPHA2_REQUIRE: browser,wasm
        run: |
          node scripts/test-wasm-browser.mjs --case renderer-auto
          node scripts/test-wasm-browser.mjs --case renderer-auto-worker
      - name: Skips this run recorded
        if: always()
        run: node scripts/skip-log-summary.mjs "$ALPHA2_SKIP_LOG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-records-${{ matrix.key }}
          path: |
            target/skip-log.jsonl
            target/browser-reports
            target/editor-reports
          if-no-files-found: ignore

  gpu-validation:
    # GPU suites under each backend's validation layer; reports only, does not fail yet.
    if: >-
      ${{ (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',gpu-validation,')) &&
      github.event_name != 'pull_request' }}
    name: GPU validation (${{ matrix.backend }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: vulkan
            runner: ubuntu-24.04
            target: linux-x64
            crates: -p alpha2-render -p alpha2-engine
          - backend: metal
            runner: macos-26
            target: macos-arm64
            crates: -p alpha2-render -p alpha2-engine -p alpha2-native-gpu -p alpha2-host
          - backend: dx12
            runner: windows-2025
            target: win-x64
            crates: -p alpha2-render -p alpha2-engine -p alpha2-native-gpu -p alpha2-host
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Provenance
        shell: bash
        run: |
          echo "image: $ImageOS $ImageVersion"
          rustc --version
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          save-if: ${{ env.SAVE_RUST_CACHE }}
      - name: Install Mesa software GPU drivers and the Khronos validation layer
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install --yes mesa-vulkan-drivers
          layers="$(scripts/fetch-vulkan-validation-layer.sh)"
          set -- /usr/share/vulkan/icd.d/lvp_icd*.json
          {
            echo "VK_LAYER_PATH=$layers"
            echo "VK_ICD_FILENAMES=$1"
          } >> "$GITHUB_ENV"
      - name: Install the D3D12 debug layer
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-WindowsCapability -Online -Name "Tools.Graphics.DirectX~~~~0.0.1.0"
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install pkg-config
      - name: Pin the FFmpeg SDK
        run: |
          sdk_root="$(scripts/fetch-ffmpeg-sdk.sh ${{ matrix.target }})"
          if [ "${{ runner.os }}" = Windows ]; then
            sdk_root="$(cygpath -m "$sdk_root")"
            {
              echo "FFMPEG_INCLUDE_DIR=$sdk_root/include"
              echo "FFMPEG_LIBS_DIR=$sdk_root/lib"
              echo "FFMPEG_LINK_MODE=dynamic"
            } >> "$GITHUB_ENV"
            echo "$sdk_root/bin" >> "$GITHUB_PATH"
          else
            {
              echo "PKG_CONFIG_PATH=$sdk_root/lib/pkgconfig"
              echo "FFMPEG_PKG_CONFIG_PATH=$sdk_root/lib/pkgconfig"
              echo "FFMPEG_LINK_MODE=dynamic"
            } >> "$GITHUB_ENV"
            if [ "${{ runner.os }}" = Linux ]; then
              echo "LD_LIBRARY_PATH=$sdk_root/lib" >> "$GITHUB_ENV"
            fi
          fi
      # The Windows host refuses to start without the pinned DXC.
      - if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dxc
          key: dxc-${{ hashFiles('release/dxc/manifest.toml') }}
      - name: Fetch the pinned DXC
        if: runner.os == 'Windows'
        run: echo "ALPHA2_DXC_PATH=$(scripts/fetch-dxc.sh "$RUNNER_TEMP/dxc")" >> "$GITHUB_ENV"
      - name: Adapters
        run: cargo run -q -p alpha2-gpu --example adapters
      - name: GPU suites under ${{ matrix.backend }} validation
        run: node scripts/test-gpu-validation.mjs --backend ${{ matrix.backend }} ${{ matrix.crates }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gpu-validation-${{ matrix.backend }}
          path: target/gpu-validation
          if-no-files-found: ignore

  package:
    # Skipped under release.yml, which runs package.yml itself. Pull requests package one target
    # per OS.
    if: >-
      ${{ github.workflow == 'ci' && needs.changes.outputs.packaging == 'true' &&
      (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',package,')) }}
    needs: changes
    uses: ./.github/workflows/package.yml
    with:
      targets: >-
        ${{ github.event_name == 'pull_request' && '["linux-x64","macos-arm64","win-x64"]' ||
        '["linux-x64","linux-arm64","macos-arm64","win-x64"]' }}
      upload-name-prefix: ci-
