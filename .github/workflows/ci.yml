name: ci

on:
  pull_request:
  push:
    branches: [main, "prerelease-v*"]
  workflow_dispatch:
    inputs:
      jobs:
        description: Job ids to run, comma-separated (empty runs every job)
        type: string
        default: ""
  workflow_call:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  MACOSX_DEPLOYMENT_TARGET: "11.0"
  # Runners have no GPU, so `auto` would pick the CPU renderer; GPU jobs run on lavapipe.
  ALPHA2_RENDERER: gpu
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  ALPHA2_SKIP_LOG: ${{ github.workspace }}/target/skip-log.jsonl

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      native: ${{ steps.areas.outputs.native }}
      js: ${{ steps.areas.outputs.js }}
      e2e: ${{ steps.areas.outputs.e2e }}
      packaging: ${{ steps.areas.outputs.packaging }}
      browser: ${{ steps.areas.outputs.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: areas
        uses: ./.github/actions/changes
        with:
          workflow: ci.yml

  rust-checks:
    if: >-
      ${{ (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',rust-checks,')) &&
      needs.changes.outputs.native == 'true' }}
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost
          df -h /
      - name: Install native media build dependencies
        timeout-minutes: 5
        run: >-
          sudo apt-get -o Acquire::Retries=3 update &&
          sudo apt-get -o Acquire::Retries=3 install --yes
          libasound2-dev pkg-config clang mesa-vulkan-drivers
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/ffmpeg-sdk
        with:
          target: linux-x64
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - id: ready
        run: npm ci
      - id: fmt
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: cargo fmt --check
      - id: metadata
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: cargo metadata --locked --format-version 1 > /dev/null
      - id: clippy
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: npm run lint:rust
      - id: clippy-native
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: cargo clippy -p alpha2-native --all-targets -- -D warnings
      - id: schema
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: scripts/check-schema-fresh.sh
      - id: extension-features
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: scripts/check-extension-features.sh
      - id: native-features
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: scripts/check-native-features.sh
      - id: bench-timeline
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: cargo bench -p alpha2-eval --bench timeline_evaluation
      - id: benches-build
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: cargo bench --workspace --all-features --no-run
      - if: always()
        uses: ./.github/actions/test-report
        with:
          lane: rust-checks
          group: ci
          steps: ${{ toJSON(steps) }}

  rust-tests:
    if: >-
      ${{ (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',rust-tests,')) &&
      needs.changes.outputs.native == 'true' }}
    needs: changes
    name: Rust tests (--${{ matrix.features }})
    strategy:
      fail-fast: false
      matrix:
        features: [all-features, no-default-features]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ALPHA2_REQUIRE: c-compiler,ffmpeg-tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost
          df -h /
      - name: Install native media build dependencies
        timeout-minutes: 5
        run: >-
          sudo apt-get -o Acquire::Retries=3 update &&
          sudo apt-get -o Acquire::Retries=3 install --yes
          libasound2-dev pkg-config clang mesa-vulkan-drivers
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ${{ matrix.features }}
          cache-workspaces: |
            . -> target
            plugins -> target
      - uses: ./.github/actions/ffmpeg-sdk
        with:
          target: linux-x64
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ffmpeg-tools
          key: ffmpeg-tools-linux-x64-${{ hashFiles('release/ffmpeg-tools/manifest.toml', 'scripts/fetch-ffmpeg-tools.sh') }}
      - name: Pin the FFmpeg tools the container tests compare against
        env:
          ALPHA2_FFMPEG_CACHE: ${{ runner.temp }}/ffmpeg-tools
        run: |
          tools="$(scripts/fetch-ffmpeg-tools.sh linux-x64)"
          {
            echo "ALPHA2_FFPROBE=$tools/ffprobe"
            echo "ALPHA2_FFMPEG=$tools/ffmpeg"
          } >> "$GITHUB_ENV"
      - name: Build the plugins the tests pack
        run: scripts/pack-plugins.sh --fixtures "$RUNNER_TEMP/plugins"
      - id: rust
        run: >-
          cargo test --workspace --${{ matrix.features }} --no-fail-fast 2>&1
          | tee target/test-logs/rust.log
      - if: always()
        uses: ./.github/actions/test-report
        with:
          lane: rust-tests-${{ matrix.features }}
          group: ci
          steps: ${{ toJSON(steps) }}

  js:
    if: >-
      ${{ (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',js,')) &&
      needs.changes.outputs.js == 'true' }}
    needs: [changes, release-wasm]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ALPHA2_REQUIRE: wasm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native media build dependencies
        timeout-minutes: 5
        run: >-
          sudo apt-get -o Acquire::Retries=3 update &&
          sudo apt-get -o Acquire::Retries=3 install --yes
          libasound2-dev pkg-config clang mesa-vulkan-drivers
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/ffmpeg-sdk
        with:
          target: linux-x64
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: taiki-e/cache-cargo-install-action@9ee83daaa7b96a6fab930949ecf1122bba04a389 # v3.0.8
        with:
          tool: wasm-bindgen-cli@0.2.128
      - id: ready
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: alpha2-build
          path: packages
      - id: format
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: npm run format:check
      - id: test-js
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: npm run test:js
      - id: lint
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: npm run lint
      - id: typecheck
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: npm run typecheck
      - id: wasm-parity
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: npm run test:wasm-parity
      - id: render-determinism
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: npm run test:render-determinism
      - id: package
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: npm run test:package
      - id: clean-consumers
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: scripts/test-clean-consumers.sh
      - if: always()
        uses: ./.github/actions/test-report
        with:
          lane: js
          group: ci
          steps: ${{ toJSON(steps) }}

  host:
    if: >-
      ${{ (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',host,')) &&
      needs.changes.outputs.js == 'true' }}
    needs: [changes, release-wasm]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ALPHA2_REQUIRE: wasm,browser,python,host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native media build dependencies
        timeout-minutes: 5
        run: >-
          sudo apt-get -o Acquire::Retries=3 update &&
          sudo apt-get -o Acquire::Retries=3 install --yes
          libasound2-dev pkg-config clang mesa-vulkan-drivers
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/ffmpeg-sdk
        with:
          target: linux-x64
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: alpha2-build
          path: packages
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/test-browsers
          key: test-browsers-${{ hashFiles('release/test-browsers/manifest.toml', 'scripts/fetch-test-browsers.sh') }}
      - name: Fetch the pinned Chrome, Firefox and geckodriver
        timeout-minutes: 10
        run: scripts/fetch-test-browsers.sh "$RUNNER_TEMP/test-browsers" | tee -a "$GITHUB_ENV"
      - name: Build the Python package the parity and end-to-end checks run
        id: ready
        working-directory: python/alpha2
        # --no-deps: the pinned alpha2-host wheel is not published yet; these checks use the host
        # built here.
        run: |
          pipx install uv==0.9.17
          uv venv -p 3.11 .venv
          uv pip install --group dev
          uv pip install --no-deps -e .
      - id: host-parity
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        env:
          ALPHA2_CHROME_GPU: swiftshader
        run: npm run test:host-parity 2>&1 | tee target/test-logs/host-parity.log
      - name: A Vulkan device without Vulkan Video falls back to software
        id: lavapipe-fallback
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: |
          cargo build -p alpha2-host
          set -- /usr/share/vulkan/icd.d/lvp_icd*.json
          icd="$1"
          test -f "$icd"
          VK_ICD_FILENAMES="$icd" \
            target/debug/alpha2-host export \
            --project tests/cases/host-parity-project.json \
            --asset image-source=tests/corpus/cross_topology_parity.png \
            --out "$RUNNER_TEMP/lavapipe.mp4" --no-audio --video-codec mpeg4-part2 \
            2> "$RUNNER_TEMP/lavapipe.log" || { cat "$RUNNER_TEMP/lavapipe.log"; exit 1; }
          grep "hardware decode unavailable, using software" "$RUNNER_TEMP/lavapipe.log"
      - if: always()
        uses: ./.github/actions/test-report
        with:
          lane: host
          group: ci
          steps: ${{ toJSON(steps) }}

  openh264:
    if: >-
      ${{ (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',openh264,')) &&
      needs.changes.outputs.native == 'true' }}
    needs: changes
    name: OpenH264 (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      ALPHA2_REQUIRE: openh264,c-compiler
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native media build dependencies
        timeout-minutes: 5
        run: >-
          sudo apt-get -o Acquire::Retries=3 update &&
          sudo apt-get -o Acquire::Retries=3 install --yes
          libasound2-dev pkg-config clang mesa-vulkan-drivers bzip2
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: openh264
      - uses: ./.github/actions/ffmpeg-sdk
        with:
          target: ${{ matrix.target }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Downloaded from Cisco for tests only; never bundled into uploaded artifacts.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openh264
          key: openh264-${{ matrix.target }}-${{ hashFiles('release/openh264/manifest.toml') }}
      - name: Fetch Cisco's OpenH264 binary
        id: ready
        env:
          TARGET: ${{ matrix.target }}
        run: |
          library="$(scripts/fetch-openh264.sh "$TARGET" "$RUNNER_TEMP/openh264")"
          echo "ALPHA2_OPENH264_LIBRARY=$library" >> "$GITHUB_ENV"
      - name: Loader, encoder and sink tests
        id: native
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: >-
          cargo test --release -p alpha2-native --lib openh264 --no-fail-fast 2>&1
          | tee target/test-logs/native.log
      - name: Host tests
        id: host
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: >-
          cargo test --release -p alpha2-host openh264 --no-fail-fast 2>&1
          | tee target/test-logs/host.log
      - name: The Node client decompresses Cisco's archive to the library the manifest pins
        id: node-bzip2
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: |
          npm run build:js --workspace alpha2
          npm run build --workspace @alpha2-sh/node
          ALPHA2_TEST_OPENH264_ARCHIVE="$(ls "$RUNNER_TEMP"/openh264/*.bz2)" \
            node scripts/run-node-tests.mjs node-bzip2 packages/alpha2-node/test/bzip2.test.mjs
      - name: A GPU without an H.264 encoder exports H.264 through OpenH264, the same bytes twice
        id: export-twice
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: |
          cargo build --release -p alpha2-host
          set -- /usr/share/vulkan/icd.d/lvp_icd*.json
          python3 - "$RUNNER_TEMP/openh264-project.json" <<'EOF'
          import json, sys
          project = json.load(open("tests/cases/host-parity-complex-project.json"))
          project["settings"].update(width=1920, height=1080)
          json.dump(project, open(sys.argv[1], "w"))
          EOF
          for run in first second; do
            VK_ICD_FILENAMES="$1" target/release/alpha2-host export \
              --project "$RUNNER_TEMP/openh264-project.json" \
              --asset video=tests/corpus/parity-rgb.mov --asset still=tests/corpus/parity-image.png \
              --out "$RUNNER_TEMP/$run.mp4" > "$RUNNER_TEMP/$run.json" 2> "$RUNNER_TEMP/$run.log" \
              || { cat "$RUNNER_TEMP/$run.log"; exit 1; }
          done
          python3 - "$RUNNER_TEMP/first.json" <<'EOF'
          import json, sys
          result = json.load(open(sys.argv[1]))["result"]
          assert result["videoEncoder"] == "openh264", result["videoEncoder"]
          assert result["videoEncoderClass"] == "software"
          assert result["videoThreadCount"] == 4, result["videoThreadCount"]
          assert result["frames"] == 36, result["frames"]
          assert result["videoEncoderLibrary"]["provider"] == "cisco-openh264"
          assert not any(f["encoder"].endswith(("_vulkan", "_nvenc")) for f in result["videoEncoderFallbacks"])
          EOF
          cmp "$RUNNER_TEMP/first.mp4" "$RUNNER_TEMP/second.mp4"
      - name: Each client uses an OpenH264 it installs into its cache, in the same process
        id: clients
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        env:
          PYTEST_ADDOPTS: --junitxml=${{ github.workspace }}/target/test-results/pytest-openh264.xml
        run: |
          cargo build --release -p alpha2-host
          archive="$(ls "$RUNNER_TEMP"/openh264/*.bz2)"
          ALPHA2_HOST_BINARY="$PWD/target/release/alpha2-host" ALPHA2_TEST_OPENH264_ARCHIVE="$archive" \
            node scripts/run-node-tests.mjs node-openh264 --test-name-pattern 'OpenH264 installed' \
            packages/alpha2-node/test/e2e/host-export.test.mjs
          pipx install uv==0.13.3
          cd python/alpha2
          uv venv -q -p 3.11 .venv
          uv pip install -q --group dev
          uv pip install -q --no-deps -e .
          ALPHA2_HOST_BINARY="$GITHUB_WORKSPACE/target/release/alpha2-host" ALPHA2_TEST_OPENH264_ARCHIVE="$archive" \
            .venv/bin/pytest tests/e2e/test_e2e.py -k openh264
      - if: always()
        uses: ./.github/actions/test-report
        with:
          lane: openh264-${{ matrix.target }}
          group: ci
          steps: ${{ toJSON(steps) }}

  cpu-renderer:
    if: >-
      ${{ (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',cpu-renderer,')) &&
      needs.changes.outputs.native == 'true' }}
    needs: changes
    name: CPU renderer
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      ALPHA2_REQUIRE: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native media build dependencies and the distro FFmpeg
        timeout-minutes: 5
        run: >-
          sudo apt-get -o Acquire::Retries=3 update &&
          sudo apt-get -o Acquire::Retries=3 install --yes
          libasound2-dev pkg-config clang mesa-vulkan-drivers
          libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: cpu-renderer
          cache-workspaces: |
            . -> target
            plugins -> target
      - uses: ./.github/actions/ffmpeg-sdk
        with:
          target: linux-x64
      - name: Build the plugins the tests pack
        id: ready
        run: scripts/pack-plugins.sh --fixtures "$RUNNER_TEMP/plugins"
      - name: Every CPU pass against the GPU's on lavapipe
        id: parity
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: >-
          cargo test --release -p alpha2-render --lib cpu_ --no-fail-fast 2>&1
          | tee target/test-logs/parity.log
      - name: The host suite on the CPU renderer
        id: host
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        env:
          ALPHA2_RENDERER: cpu
        run: cargo test --release -p alpha2-host --no-fail-fast 2>&1 | tee target/test-logs/host.log
      - name: Without any graphics driver, and with only lavapipe, auto renders on the CPU
        id: auto-cpu
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        env:
          ALPHA2_RENDERER: auto
        run: |
          cargo build --release -p alpha2-host
          set -- /usr/share/vulkan/icd.d/lvp_icd*.json
          for case in none lavapipe; do
            if [ "$case" = none ]; then icd=/nonexistent; else icd="$1"; fi
            VK_ICD_FILENAMES="$icd" WGPU_BACKEND=vulkan target/release/alpha2-host export \
              --project tests/cases/host-parity-complex-project.json \
              --asset video=tests/corpus/parity-rgb.mov --asset still=tests/corpus/parity-image.png \
              --no-audio --video-codec mpeg4-part2 --out "$RUNNER_TEMP/$case.mp4" \
              > "$RUNNER_TEMP/$case.json" 2> "$RUNNER_TEMP/$case.log" \
              || { cat "$RUNNER_TEMP/$case.log"; exit 1; }
            python3 - "$RUNNER_TEMP/$case.json" <<'EOF'
          import json, sys
          result = json.load(open(sys.argv[1]))["result"]
          assert result["renderer"] == "cpu", result["renderer"]
          assert result["rendererReason"], result
          assert result["frames"] == 36, result["frames"]
          EOF
          done
      - name: The host links the pinned FFmpeg, not the distro's
        id: pinned-ffmpeg
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: |
          shopt -s inherit_errexit
          cargo build --release -p alpha2-host
          linked="$(ldd target/release/alpha2-host | grep -E 'libav(codec|format|util)|libsw(resample|scale)')"
          echo "$linked"
          if grep -v "=> $LD_LIBRARY_PATH/" <<< "$linked"; then
            echo "alpha2-host links an FFmpeg library outside the pinned SDK" >&2
            exit 1
          fi
      - name: The host suite without extensions or hardware video, on the CPU renderer
        id: host-minimal
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        env:
          ALPHA2_RENDERER: cpu
        run: >-
          cargo test --release -p alpha2-host --no-default-features --no-fail-fast 2>&1
          | tee target/test-logs/host-minimal.log
      - if: always()
        uses: ./.github/actions/test-report
        with:
          lane: cpu-renderer
          group: ci
          steps: ${{ toJSON(steps) }}

  wasm-audio:
    if: >-
      ${{ (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',wasm-audio,') ||
      contains(format(',{0},', inputs.jobs), ',host,')) &&
      needs.changes.outputs.native == 'true' }}
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: cargo build -p alpha2-wasm --target wasm32-unknown-unknown
      - run: cargo build -p alpha2-audio-worklet --target wasm32-unknown-unknown
      - id: audio-determinism
        run: npm run test:audio-determinism
      - if: always()
        uses: ./.github/actions/test-report
        with:
          lane: wasm-audio
          group: ci
          steps: ${{ toJSON(steps) }}

  msrv:
    if: >-
      ${{ (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',msrv,')) &&
      needs.changes.outputs.native == 'true' }}
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native media build dependencies
        timeout-minutes: 5
        run: >-
          sudo apt-get -o Acquire::Retries=3 update &&
          sudo apt-get -o Acquire::Retries=3 install --yes
          libasound2-dev pkg-config clang
      - name: Install the rust-version toolchain
        run: |
          msrv="$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)"
          test -n "$msrv"
          rustup toolchain install "$msrv" --profile minimal
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/ffmpeg-sdk
        with:
          target: linux-x64
      - id: check
        run: cargo "+$MSRV" check --workspace --all-targets --all-features
      - if: always()
        uses: ./.github/actions/test-report
        with:
          lane: msrv
          group: ci
          steps: ${{ toJSON(steps) }}

  valgrind:
    if: >-
      ${{ (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',valgrind,')) &&
      needs.changes.outputs.native == 'true' }}
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ALPHA2_REQUIRE: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native media build dependencies
        timeout-minutes: 5
        run: >-
          sudo apt-get -o Acquire::Retries=3 update &&
          sudo apt-get -o Acquire::Retries=3 install --yes
          libasound2-dev pkg-config clang valgrind libvulkan-dev
      - uses: ./.github/actions/setup-rust
      - id: ready
        uses: ./.github/actions/ffmpeg-sdk
        with:
          target: linux-x64
      - name: Bridge and native binding tests under valgrind
        id: valgrind
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: valgrind --error-exitcode=9 --quiet
          ALPHA2_TEST_DECODE_WORK_LIMIT_MS: "600000"
          # SVT-AV1 in the SDK's libavcodec reads uninitialized memory in its own threads.
          ALPHA2_TEST_SKIP_ENCODERS: libsvtav1
        run: >-
          cargo test -p alpha2-ffmpeg-bridge -p alpha2-native --features alpha2-ffmpeg-bridge/hwdevice
          --lib --bins --tests --no-fail-fast 2>&1 | tee target/test-logs/valgrind.log
      - name: GPU timeout configuration under ThreadSanitizer
        id: tsan
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: bash scripts/test-gpu-timeout-race.sh 2>&1 | tee target/test-logs/tsan.log
      - if: always()
        uses: ./.github/actions/test-report
        with:
          lane: valgrind
          group: ci
          steps: ${{ toJSON(steps) }}

  wasm-lint:
    if: >-
      ${{ (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',wasm-lint,')) &&
      needs.changes.outputs.native == 'true' }}
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - id: clippy
        run: >-
          cargo clippy -p alpha2-wasm -p alpha2-audio-worklet
          --target wasm32-unknown-unknown -- -D warnings
      - if: always()
        uses: ./.github/actions/test-report
        with:
          lane: wasm-lint
          group: ci
          steps: ${{ toJSON(steps) }}

  fuzz-check:
    if: >-
      ${{ (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',fuzz-check,')) &&
      needs.changes.outputs.native == 'true' }}
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: ready
        uses: ./.github/actions/setup-rust
        with:
          cache-workspaces: fuzz
      - id: fmt
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: cargo fmt --manifest-path fuzz/Cargo.toml --check
      - id: clippy
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: cargo clippy --manifest-path fuzz/Cargo.toml --locked --bins -- -D warnings
      - uses: taiki-e/cache-cargo-install-action@9ee83daaa7b96a6fab930949ecf1122bba04a389 # v3.0.8
        id: cargo-fuzz
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        with:
          tool: cargo-fuzz@0.12.0
      - name: Build and briefly run one fuzz target
        id: fuzz
        if: ${{ !cancelled() && steps.cargo-fuzz.outcome == 'success' }}
        run: scripts/fuzz.sh 60 evaluate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-check-evaluate
          path: |
            fuzz/artifacts/evaluate
            fuzz/logs/evaluate.log
          if-no-files-found: ignore
      - if: always()
        uses: ./.github/actions/test-report
        with:
          lane: fuzz-check
          group: ci
          steps: ${{ toJSON(steps) }}

  plugins-check:
    if: >-
      ${{ (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',plugins-check,')) &&
      needs.changes.outputs.native == 'true' }}
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: ready
        uses: ./.github/actions/setup-rust
        with:
          cache-workspaces: plugins
      - id: fmt
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: cargo fmt --manifest-path plugins/Cargo.toml --all --check
      - id: clippy
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: cargo clippy --manifest-path plugins/Cargo.toml --locked --all-targets -- -D warnings
      - id: clippy-wasm
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: >-
          cargo clippy --manifest-path plugins/Cargo.toml --locked --target wasm32-unknown-unknown
          -p alpha2-plugin-sdk -p alpha2-plugin-fixture-digest -p alpha2-plugin-fixture-scripted
          -- -D warnings
      - id: test
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: cargo test --manifest-path plugins/Cargo.toml --locked 2>&1 | tee target/test-logs/test.log
      - name: Pack the plugins (wasm32 and the host triple; the wasm modules are checked)
        id: pack
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: scripts/pack-plugins.sh --fixtures "$RUNNER_TEMP/plugins"
      - if: always()
        uses: ./.github/actions/test-report
        with:
          lane: plugins-check
          group: ci
          steps: ${{ toJSON(steps) }}

  platform-lint:
    if: >-
      ${{ (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',platform-lint,')) &&
      needs.changes.outputs.native == 'true' }}
    needs: changes
    name: Platform lint (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-26
          - target: win-x64
            runner: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: brew install pkg-config
      - uses: ./.github/actions/ffmpeg-sdk
        with:
          target: ${{ matrix.target }}
      - if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dxc
          key: dxc-${{ hashFiles('release/dxc/manifest.toml') }}
      - name: Fetch the pinned DXC
        if: runner.os == 'Windows'
        run: echo "ALPHA2_DXC_PATH=$(scripts/fetch-dxc.sh "$RUNNER_TEMP/dxc")" >> "$GITHUB_ENV"
      - name: Install the rust-version toolchain
        id: ready
        run: |
          msrv="$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)"
          test -n "$msrv"
          rustup toolchain install "$msrv" --profile minimal
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
      - name: Clippy of the native crates
        id: clippy
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: >-
          cargo clippy -p alpha2-native -p alpha2-native-gpu -p alpha2-host -p alpha2-ffmpeg-bridge
          -p alpha2-os -p alpha2-build-support --all-features --all-targets -- -D warnings
      - id: native-features
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: scripts/check-native-features.sh
      - name: The native crates build with the rust-version toolchain
        id: msrv
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: >-
          cargo "+$MSRV" check -p alpha2-native -p alpha2-native-gpu -p alpha2-host
          -p alpha2-ffmpeg-bridge -p alpha2-os -p alpha2-build-support --all-targets --all-features
      - name: The benches build
        id: benches
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: cargo bench --no-run -p alpha2-render -p alpha2-native
      - name: Link and start the host
        id: host-starts
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: |
          cargo build -p alpha2-host
          { target/debug/alpha2-host 2>&1 || true; } | grep "usage: alpha2-host"
      - name: The Windows host reports DXC
        id: host-dxc
        if: ${{ !cancelled() && steps.ready.outcome == 'success' && runner.os == 'Windows' }}
        run: |
          cargo build -p alpha2-host
          python - <<'PY'
          import json, os, struct, subprocess
          header = json.dumps({"protocolVersion": 2, "requestId": "c", "operation": "capabilities"})
          frame = struct.pack("<II", len(header), 0) + header.encode()
          env = {**os.environ, "ALPHA2_RENDERER": "gpu"}
          run = subprocess.run(["target/debug/alpha2-host", "serve"], input=frame, env=env,
                               capture_output=True, check=True)
          out = run.stdout[run.stdout.index(b"\x89A2HOST\n") + 8:]
          answer = None
          while out and answer is None:
              size, attached = struct.unpack_from("<II", out)
              message = json.loads(out[8:8 + size])
              out = out[8 + size + attached:]
              if message.get("requestId") == "c":
                  answer = message
          compiler = answer["result"]["capabilities"]["gpu"]["shaderCompiler"]
          assert compiler.startswith("DXC"), compiler
          print(compiler)
          PY
      - if: always()
        uses: ./.github/actions/test-report
        with:
          lane: platform-lint-${{ matrix.target }}
          group: ci
          steps: ${{ toJSON(steps) }}

  mobile-lint:
    if: >-
      ${{ (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',mobile-lint,')) &&
      needs.changes.outputs.native == 'true' }}
    name: Mobile lint (${{ matrix.platform }})
    needs: changes
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # The runner's NDK must stay installed, so this job has no disk cleanup step.
          - platform: android
            runner: ubuntu-24.04
            targets: aarch64-linux-android x86_64-linux-android
          - platform: ios
            runner: macos-26
            targets: aarch64-apple-ios aarch64-apple-ios-sim
    env:
      # The mobile crate set: everything an app links. FFmpeg-linked crates are desktop only.
      MOBILE_PACKAGES: -p alpha2-os -p alpha2-native-gpu -p alpha2-extensions -p alpha2-text
        -p alpha2-host-core -p alpha2-container -p alpha2-backend-conformance
        -p alpha2-android-media -p alpha2-apple-media -p alpha2-mobile
      MOBILE_ALL_FEATURE_PACKAGES: -p alpha2 -p alpha2-compose -p alpha2-host-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: ready
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.targets }}
          cache-key: ${{ matrix.platform }}
      - if: matrix.platform == 'android'
        uses: ./.github/actions/android-ndk
        with:
          targets: ${{ matrix.targets }}
      - if: matrix.platform == 'ios'
        uses: ./.github/actions/xcode
      - name: Clippy of the mobile crate set
        id: clippy
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          status=0
          for target in $TARGETS; do
            echo "::group::$target"
            cargo clippy --locked $MOBILE_PACKAGES --all-targets --target "$target" -- -D warnings ||
              status=1
            cargo clippy --locked $MOBILE_ALL_FEATURE_PACKAGES --all-features --all-targets \
              --target "$target" -- -D warnings || status=1
            echo "::endgroup::"
          done
          exit "$status"
      - if: always()
        uses: ./.github/actions/test-report
        with:
          lane: mobile-lint-${{ matrix.platform }}
          group: ci
          steps: ${{ toJSON(steps) }}

  platform-js:
    if: >-
      ${{ (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',platform-js,')) &&
      needs.changes.outputs.js == 'true' }}
    name: JavaScript tests (${{ matrix.runner }})
    needs: [changes, release-wasm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, windows-2025]
    env:
      ALPHA2_REQUIRE: wasm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: alpha2-build
          path: packages
      - id: test-js
        run: npm run test:js
      - if: always()
        uses: ./.github/actions/test-report
        with:
          lane: platform-js-${{ matrix.runner }}
          group: ci
          steps: ${{ toJSON(steps) }}

  platform-native:
    if: >-
      ${{ (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',platform-native,')) &&
      needs.changes.outputs.native == 'true' }}
    name: Native tests (${{ matrix.target }}, ${{ matrix.profile }}, software adapter)
    needs: changes
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        target: [macos-arm64, win-x64]
        profile: ${{ fromJSON(github.event_name == 'pull_request' && '["debug"]' || '["debug","release"]') }}
        include:
          - target: macos-arm64
            runner: macos-26
            require: openh264,c-compiler
          - target: win-x64
            runner: windows-2025
            require: openh264,dxc
    env:
      ALPHA2_REQUIRE: ${{ matrix.require }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ${{ matrix.profile }}
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: brew install pkg-config
      - uses: ./.github/actions/ffmpeg-sdk
        with:
          target: ${{ matrix.target }}
      - if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dxc
          key: dxc-${{ hashFiles('release/dxc/manifest.toml') }}
      - name: Fetch the pinned DXC
        if: runner.os == 'Windows'
        run: echo "ALPHA2_DXC_PATH=$(scripts/fetch-dxc.sh "$RUNNER_TEMP/dxc")" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openh264
          key: openh264-${{ matrix.target }}-${{ hashFiles('release/openh264/manifest.toml') }}
      - name: Fetch Cisco's OpenH264 binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          library="$(scripts/fetch-openh264.sh "$TARGET" "$RUNNER_TEMP/openh264")"
          echo "ALPHA2_OPENH264_LIBRARY=$library" >> "$GITHUB_ENV"
      - name: Adapters
        id: ready
        run: cargo run -q -p alpha2-gpu --example adapters
      - name: Native and host tests (debug)
        id: debug
        if: ${{ !cancelled() && steps.ready.outcome == 'success' && matrix.profile == 'debug' }}
        run: >-
          cargo test --locked --all-features --no-fail-fast -p alpha2-os -p alpha2-build-support
          -p alpha2-ffmpeg-bridge -p alpha2-native -p alpha2-native-gpu -p alpha2-gpu -p alpha2-host
          2>&1 | tee target/test-logs/debug.log
      - name: Native and host tests (release, strict GPU errors)
        id: release
        if: ${{ !cancelled() && steps.ready.outcome == 'success' && matrix.profile == 'release' }}
        env:
          ALPHA2_GPU_STRICT: "1"
        run: >-
          cargo test --locked --release --all-features --no-fail-fast -p alpha2-os
          -p alpha2-build-support -p alpha2-ffmpeg-bridge -p alpha2-native -p alpha2-native-gpu
          -p alpha2-gpu -p alpha2-host 2>&1 | tee target/test-logs/release.log
      - name: H.264 goes through OpenH264, the same bytes twice
        id: openh264
        if: ${{ !cancelled() && steps.ready.outcome == 'success' && matrix.profile == 'release' }}
        run: |
          cargo build --release -p alpha2-host
          node -e '
            const fs = require("node:fs");
            const project = JSON.parse(fs.readFileSync("tests/cases/host-parity-complex-project.json", "utf8"));
            Object.assign(project.settings, { width: 1920, height: 1080 });
            fs.writeFileSync(process.argv[1], JSON.stringify(project));
          ' "$RUNNER_TEMP/openh264-project.json"
          # These runners also have a platform H.264 encoder, which the host would prefer.
          for run in first second; do
            target/release/alpha2-host export --project "$RUNNER_TEMP/openh264-project.json" \
              --asset video=tests/corpus/parity-rgb.mov --asset still=tests/corpus/parity-image.png \
              --video-encoder openh264 \
              --out "$RUNNER_TEMP/$run.mp4" > "$RUNNER_TEMP/$run.json" 2> "$RUNNER_TEMP/$run.log" \
              || { cat "$RUNNER_TEMP/$run.log"; exit 1; }
          done
          node -e '
            const { result } = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            const check = (ok, what) => { if (!ok) throw new Error(what + ": " + JSON.stringify(result)); };
            check(result.videoEncoder === "openh264", "videoEncoder");
            check(result.videoEncoderClass === "software", "videoEncoderClass");
            check(result.frames === 36, "frames");
            check(result.videoEncoderLibrary.provider === "cisco-openh264", "provider");
          ' "$RUNNER_TEMP/first.json"
          cmp "$RUNNER_TEMP/first.mp4" "$RUNNER_TEMP/second.mp4"
      - if: always()
        uses: ./.github/actions/test-report
        with:
          lane: platform-native-${{ matrix.target }}-${{ matrix.profile }}
          group: ci
          steps: ${{ toJSON(steps) }}

  platform-e2e:
    if: >-
      ${{ (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',platform-e2e,')) &&
      needs.changes.outputs.e2e == 'true' }}
    name: End-to-end clients (${{ matrix.target }})
    needs: [changes, release-wasm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: macos-arm64
            runner: macos-26
          - target: win-x64
            runner: windows-2025
    env:
      ALPHA2_RENDERER: cpu
      ALPHA2_REQUIRE: python,host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native media build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: >-
          sudo apt-get -o Acquire::Retries=3 update &&
          sudo apt-get -o Acquire::Retries=3 install --yes
          libasound2-dev pkg-config clang
      - uses: ./.github/actions/setup-rust
        with:
          cache-workspaces: |
            . -> target
            plugins -> target
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: brew install pkg-config
      - uses: ./.github/actions/ffmpeg-sdk
        with:
          target: ${{ matrix.target }}
      - if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dxc
          key: dxc-${{ hashFiles('release/dxc/manifest.toml') }}
      - name: Fetch the pinned DXC
        if: runner.os == 'Windows'
        run: echo "ALPHA2_DXC_PATH=$(scripts/fetch-dxc.sh "$RUNNER_TEMP/dxc")" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: alpha2-build
          path: packages
      - name: Build the host and the Python package
        run: |
          cargo build -p alpha2-host
          cd python/alpha2
          pipx install uv==0.9.17
          uv venv -p 3.11 .venv
          uv pip install --group dev
          uv pip install --no-deps -e .
          if [ -d .venv/Scripts ]; then echo "PY=$PWD/.venv/Scripts" >> "$GITHUB_ENV"; else echo "PY=$PWD/.venv/bin" >> "$GITHUB_ENV"; fi
      - name: Build the plugins the tests pack
        id: ready
        run: scripts/pack-plugins.sh --fixtures "$RUNNER_TEMP/plugins"
      - id: node-e2e
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: npm run test:node-e2e
      - name: Python end-to-end tests
        id: python-e2e
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        env:
          ALPHA2_HOST_BINARY: ${{ github.workspace }}/target/debug/alpha2-host${{ runner.os == 'Windows' && '.exe' || '' }}
          PYTEST_ADDOPTS: --junitxml=${{ github.workspace }}/target/test-results/pytest-e2e.xml
        run: '"$PY/pytest" python/alpha2/tests/e2e'
      - if: always()
        uses: ./.github/actions/test-report
        with:
          lane: platform-e2e-${{ matrix.target }}
          group: ci
          steps: ${{ toJSON(steps) }}

  python:
    if: >-
      ${{ (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',python,')) &&
      needs.changes.outputs.e2e == 'true' }}
    needs: changes
    name: Python package (${{ matrix.runner }}, ${{ matrix.python }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-26, windows-2025]
        python: ["3.11", "3.15"]
    defaults:
      run:
        working-directory: python/alpha2
    env:
      ALPHA2_REQUIRE: native-test-hooks
      PYTEST_ADDOPTS: --junitxml=${{ github.workspace }}/target/test-results/pytest.xml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      # uv 0.13.3 is the first uv that installs CPython 3.15.0.
      - name: Build the package into a Python ${{ matrix.python }} environment
        id: ready
        env:
          PYTHON: ${{ matrix.python }}
        run: |
          pipx install uv==0.13.3
          uv venv -p "$PYTHON" .venv
          uv pip install --group dev
          # A dev build carries the native test hooks that ALPHA2_REQUIRE asks for.
          MATURIN_PEP517_ARGS="--profile dev" uv pip install --no-deps -e .
          if [ -d .venv/Scripts ]; then echo "PY=.venv/Scripts" >> "$GITHUB_ENV"; else echo "PY=.venv/bin" >> "$GITHUB_ENV"; fi
      - name: Lint and type checks
        id: lint
        if: ${{ !cancelled() && steps.ready.outcome == 'success' && runner.os == 'Linux' && matrix.python == '3.11' }}
        run: |
          "$PY/ruff" check src tests ../alpha2-host
          "$PY/ruff" format --check src tests ../alpha2-host
          "$PY/mypy"
          "$PY/mypy" --platform win32
          "$PY/mypy" --platform darwin
      - id: pytest
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: '"$PY/pytest"'
      - if: always()
        uses: ./.github/actions/test-report
        with:
          lane: python-${{ matrix.runner }}-${{ matrix.python }}
          group: ci
          steps: ${{ toJSON(steps) }}

  determinism:
    if: >-
      ${{ (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',determinism,')) &&
      needs.changes.outputs.native == 'true' }}
    needs: changes
    name: Determinism pins (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-22.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-arm64
            runner: macos-26
          - target: win-x64
            runner: windows-2025
    env:
      ALPHA2_REQUIRE: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: ready
        uses: ./.github/actions/setup-rust
      - id: pins
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: >-
          cargo test -p alpha2-audio -p alpha2-audio-determinism -p alpha2-eval -p alpha2-text
          --no-fail-fast 2>&1 | tee target/test-logs/pins.log
      - name: CPU renderer frames (no GPU needed)
        id: cpu-frames
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: >-
          cargo test -p alpha2-render --lib cpu_determinism --no-fail-fast 2>&1
          | tee target/test-logs/cpu-frames.log
      - name: CPU renderer pins and extension rasters
        id: cpu-pins
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: >-
          cargo test -p alpha2-render-determinism -p alpha2-extension-raster-pins --no-fail-fast 2>&1
          | tee target/test-logs/cpu-pins.log
      - if: always()
        uses: ./.github/actions/test-report
        with:
          lane: determinism-${{ matrix.target }}
          group: ci
          steps: ${{ toJSON(steps) }}

  security:
    if: >-
      ${{ (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',security,')) &&
      needs.changes.outputs.native == 'true' }}
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        id: deny
        with:
          command: check
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        id: deny-plugins
        if: ${{ !cancelled() }}
        with:
          manifest-path: plugins/Cargo.toml
          command: check
      - if: always()
        uses: ./.github/actions/test-report
        with:
          lane: security
          group: ci
          steps: ${{ toJSON(steps) }}

  release-wasm:
    if: >-
      ${{ (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',release-wasm,') ||
      contains(format(',{0},', inputs.jobs), ',js,') || contains(format(',{0},', inputs.jobs), ',host,') ||
      contains(format(',{0},', inputs.jobs), ',browser,') ||
      contains(format(',{0},', inputs.jobs), ',platform-js,') ||
      contains(format(',{0},', inputs.jobs), ',platform-e2e,')) &&
      (needs.changes.outputs.js == 'true' || needs.changes.outputs.e2e == 'true') }}
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A release tag publishes the npm packages built here, so tags build without caches.
      - uses: ./.github/actions/setup-rust
        with:
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: taiki-e/cache-cargo-install-action@9ee83daaa7b96a6fab930949ecf1122bba04a389 # v3.0.8
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          tool: wasm-bindgen-cli@0.2.128
      - uses: taiki-e/cache-cargo-install-action@9ee83daaa7b96a6fab930949ecf1122bba04a389 # v3.0.8
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          tool: cargo-about@0.9.2
          features: cli
      - if: startsWith(github.ref, 'refs/tags/')
        run: |
          cargo install wasm-bindgen-cli --version 0.2.128 --locked
          cargo install cargo-about --version 0.9.2 --locked --features cli
      - id: build
        run: npm run build
      - name: Pack the npm packages
        run: |
          mkdir -p target/npm-release
          npm pack --workspaces --pack-destination target/npm-release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alpha2-npm-packages
          if-no-files-found: error
          path: target/npm-release/*.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alpha2-build
          if-no-files-found: error
          path: |
            packages/*/dist
            packages/*/wasm
      - if: always()
        uses: ./.github/actions/test-report
        with:
          lane: release-wasm
          group: ci
          steps: ${{ toJSON(steps) }}

  render-goldens:
    if: >-
      ${{ (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',render-goldens,')) &&
      needs.changes.outputs.native == 'true' }}
    needs: changes
    name: Render goldens (${{ matrix.backend }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: vulkan
            runner: ubuntu-24.04
          - backend: gl
            runner: ubuntu-24.04
          - backend: dx12
            runner: windows-2025
            strict: "1"
          - backend: metal
            runner: macos-26
    env:
      WGPU_BACKEND: ${{ matrix.backend }}
      LIBGL_ALWAYS_SOFTWARE: "1"
      WGPU_VALIDATION: "1"
      MTL_DEBUG_LAYER: "1"
      ALPHA2_GPU_STRICT: ${{ matrix.strict || '0' }}
      ALPHA2_VALIDATION_REPORT: ${{ github.workspace }}/target/validation-report.jsonl
      ALPHA2_REQUIRE: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - name: Install Mesa software GPU drivers
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: >-
          sudo apt-get -o Acquire::Retries=3 update &&
          sudo apt-get -o Acquire::Retries=3 install --yes libegl1 libegl-mesa0 mesa-vulkan-drivers
      - name: Install the D3D12 debug layer
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: Add-WindowsCapability -Online -Name "Tools.Graphics.DirectX~~~~0.0.1.0"
      - if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dxc
          key: dxc-${{ hashFiles('release/dxc/manifest.toml') }}
      - name: Fetch the pinned DXC
        if: runner.os == 'Windows'
        run: echo "ALPHA2_DXC_PATH=$(scripts/fetch-dxc.sh "$RUNNER_TEMP/dxc")" >> "$GITHUB_ENV"
      - name: Adapters
        id: ready
        run: cargo run -q -p alpha2-gpu --example adapters
      - name: Run render goldens and engine frame tests on ${{ matrix.backend }}
        id: f16
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        env:
          ALPHA2_GOLDEN_ACTUAL_DIR: ${{ github.workspace }}/target/golden-actual/f16
        run: >-
          cargo test -p alpha2-render -p alpha2-engine --no-fail-fast -- --test-threads=1 2>&1
          | tee target/test-logs/f16.log
      - name: Run render goldens and engine frame tests on the 8-bit intermediate on ${{ matrix.backend }}
        id: rgba8
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        env:
          ALPHA2_TEST_INTERMEDIATE: rgba8unorm
          ALPHA2_GOLDEN_ACTUAL_DIR: ${{ github.workspace }}/target/golden-actual/rgba8
        run: >-
          cargo test -p alpha2-render --lib -p alpha2-engine --no-fail-fast -- --test-threads=1 2>&1
          | tee target/test-logs/rgba8.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: golden-actual-${{ matrix.backend }}
          path: target/golden-actual
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: validation-report-${{ matrix.backend }}
          path: target/validation-report.jsonl
          if-no-files-found: ignore
      - if: always()
        uses: ./.github/actions/test-report
        with:
          lane: render-goldens-${{ matrix.backend }}
          group: ci
          steps: ${{ toJSON(steps) }}

  browser:
    if: >-
      ${{ (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',browser,')) &&
      needs.changes.outputs.browser == 'true' }}
    needs: [changes, release-wasm]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ALPHA2_REQUIRE: browser,wasm,webgpu,webgl2,webcodecs-audio,webcodecs-video,browser-gpu-process
      ALPHA2_CHROME_GPU: swiftshader
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          cache-workspaces: |
            . -> target
            plugins -> target
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/test-browsers
          key: test-browsers-${{ hashFiles('release/test-browsers/manifest.toml', 'scripts/fetch-test-browsers.sh') }}
      - name: Fetch the pinned Chrome, Firefox and geckodriver
        timeout-minutes: 10
        run: scripts/fetch-test-browsers.sh "$RUNNER_TEMP/test-browsers" | tee -a "$GITHUB_ENV"
      - id: ready
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: alpha2-build
          path: packages
      - id: wgsl
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: npm run test:wgsl-browser 2>&1 | tee target/test-logs/wgsl.log
      - name: Build the plugins the browser cases load
        id: plugins
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: scripts/pack-plugins.sh --fixtures "$RUNNER_TEMP/plugins" --no-native
      - name: The wasm-browser cases in Chrome
        id: chrome
        if: ${{ !cancelled() && steps.plugins.outcome == 'success' }}
        run: node scripts/test-wasm-browser.mjs 2>&1 | tee target/test-logs/chrome.log
      - id: editor
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: npm run test:editor:package 2>&1 | tee target/test-logs/editor.log
      - name: The wasm-browser cases in Firefox
        id: firefox
        if: ${{ !cancelled() && steps.plugins.outcome == 'success' }}
        env:
          ALPHA2_REQUIRE: browser,wasm
        run: node scripts/test-wasm-browser.mjs --browser firefox 2>&1 | tee target/test-logs/firefox.log
      - name: With no GPU in the browser, auto renders on the CPU (page and worker)
        id: cpu-auto
        if: ${{ !cancelled() && steps.plugins.outcome == 'success' }}
        env:
          ALPHA2_CHROME_GPU: none
          ALPHA2_REQUIRE: browser,wasm
        run: |
          node scripts/test-wasm-browser.mjs --case renderer-auto 2>&1 | tee target/test-logs/cpu-auto.log
          node scripts/test-wasm-browser.mjs --case renderer-auto-worker 2>&1 | tee -a target/test-logs/cpu-auto.log
      - if: always()
        uses: ./.github/actions/test-report
        with:
          lane: browser
          group: ci
          steps: ${{ toJSON(steps) }}

  package:
    # Skipped under release.yml, which runs package.yml itself.
    if: >-
      ${{ github.workflow == 'ci' && needs.changes.outputs.packaging == 'true' &&
      (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',package,')) }}
    needs: changes
    uses: ./.github/workflows/package.yml
    with:
      targets: >-
        ${{ github.event_name == 'pull_request' && '["linux-x64","macos-arm64","win-x64"]' ||
        '["linux-x64","linux-arm64","macos-arm64","win-x64"]' }}
      upload-name-prefix: ci-

  test-reports:
    if: always()
    needs:
      - rust-checks
      - rust-tests
      - js
      - host
      - openh264
      - cpu-renderer
      - wasm-audio
      - msrv
      - valgrind
      - wasm-lint
      - fuzz-check
      - plugins-check
      - platform-lint
      - mobile-lint
      - platform-js
      - platform-native
      - platform-e2e
      - python
      - determinism
      - security
      - release-wasm
      - render-goldens
      - browser
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/upload-artifact/merge@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: test-reports-ci-attempt-${{ github.run_attempt }}
          pattern: test-report-ci-*-attempt-${{ github.run_attempt }}
          separate-directories: true
