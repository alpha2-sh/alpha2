name: scheduled

# Weekly checks too slow for every change.
on:
  schedule:
    - cron: "41 2 * * 1"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds each fuzz target runs
        type: number
        default: 1800

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0

jobs:
  fuzz-targets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: List every fuzz target
        id: list
        run: |
          shopt -s inherit_errexit
          targets="$(sed -n 's/^name = "\(.*\)"$/\1/p' fuzz/Cargo.toml | grep -vx alpha2-fuzz | jq -Rnc '[inputs]')"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  fuzz:
    name: Fuzz (${{ matrix.target }})
    needs: fuzz-targets
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.fuzz-targets.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Provenance
        run: |
          echo "image: $ImageOS $ImageVersion"
          rustc --version
      - name: Install the nightly toolchain
        run: rustup toolchain install nightly --profile minimal
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: taiki-e/cache-cargo-install-action@9ee83daaa7b96a6fab930949ecf1122bba04a389 # v3.0.8
        with:
          tool: cargo-fuzz@0.12.0
      - name: Fuzz ${{ matrix.target }}
        env:
          SECONDS_EACH: ${{ inputs.seconds || 1800 }}
          TARGET: ${{ matrix.target }}
        run: scripts/fuzz.sh "$SECONDS_EACH" "$TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}
          path: |
            fuzz/artifacts/${{ matrix.target }}
            fuzz/logs/${{ matrix.target }}.log
          if-no-files-found: ignore

  miri:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Provenance
        run: |
          echo "image: $ImageOS $ImageVersion"
          rustc --version
      - name: Install the nightly toolchain with Miri
        run: rustup toolchain install nightly --profile minimal --component miri
      - run: scripts/miri.sh
