name: Release

on:
  workflow_dispatch:
    inputs:
      skip-validate:
        description: Build the archives without running the CI gate first
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  validate:
    if: ${{ !inputs.skip-validate }}
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.match.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Match the tag, the crates and the npm packages to one version
        id: match
        run: |
          shopt -s inherit_errexit
          section_values() {
            awk -v section="$1" -v pattern="$2" '
              /^\[/ { in_section = ($0 == "[" section "]"); next }
              in_section && match($0, pattern) {
                value = substr($0, RSTART, RLENGTH); sub(/^[^"]*"/, "", value); sub(/".*$/, "", value)
                print $1 " " value
              }' Cargo.toml
          }
          version="$(section_values workspace.package '^version = "[^"]*"' | awk '{ print $2 }')"
          test -n "$version"
          mismatches="$(
            section_values workspace.dependencies 'version = "[^"]*", path = ' |
              awk -v want="$version" '$2 != want { print "Cargo.toml workspace.dependencies " $1 " " $2 }'
            names="$(jq -r '.workspaces[] + "/package.json"' package.json | xargs jq -s '[.[].name]')"
            for manifest in $(jq -r '.workspaces[] + "/package.json"' package.json); do
              jq -r --arg want "$version" --argjson names "$names" --arg manifest "$manifest" '
                (select(.version != $want) | "\($manifest) version \(.version)"),
                (.dependencies, .peerDependencies, .devDependencies, .optionalDependencies
                  | to_entries? // [] | .[]
                  | select((.key as $name | $names | index($name)) and .value != $want)
                  | "\($manifest) \(.key) \(.value)")' "$manifest"
            done
          )"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            mismatches+=$'\n'"tag $GITHUB_REF_NAME"
          fi
          if [[ -n "${mismatches//$'\n'/}" ]]; then
            echo "::error::not at the workspace version $version (npm run version:set -- <version>):"
            sed '/^$/d' <<< "$mismatches"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  package:
    needs: [validate, version]
    if: >-
      ${{ always() && needs.version.result == 'success' &&
      (needs.validate.result == 'success' || (inputs.skip-validate && needs.validate.result == 'skipped')) }}
    uses: ./.github/workflows/package.yml
    with:
      targets: '["linux-x64","linux-arm64","macos-arm64","win-x64"]'

  android:
    name: Android library
    needs: [validate, version]
    if: >-
      ${{ always() && needs.version.result == 'success' &&
      (needs.validate.result == 'success' || (inputs.skip-validate && needs.validate.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Over budget: raise the number.
      AAR_BUDGET_BYTES: "28000000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain, the Android targets and the build tools
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked
          cargo install cargo-about --version 0.9.2 --locked --features cli
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install Gradle 8.11
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.11-bin.zip
          echo "57dafb5c2622c6cc08b993c85b7c06956a2f53536432a30ead46166dbca0f1e9  $RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.11/bin" >> "$GITHUB_PATH"
      - name: Build the library
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:?}" JAVA_HOME="${JAVA_HOME_17_X64:?}"
          node scripts/crate-licenses.mjs --target aarch64-linux-android \
            --out "$RUNNER_TEMP/rust-crate-licenses.md" alpha2-mobile
          ALPHA2_NOTICES="$RUNNER_TEMP/rust-crate-licenses.md" scripts/build-android.sh
      - name: Check and name the library
        run: |
          library=packages/alpha2-android/lib
          out=target/alpha2-mobile
          mkdir -p "$out" "$RUNNER_TEMP/aar"
          aar="$out/alpha2-android-$VERSION.aar"
          cp "$library/build/outputs/aar/lib-release.aar" "$aar"
          size=$(stat -c %s "$aar")
          echo "$aar: $size bytes (budget $AAR_BUDGET_BYTES)"
          test "$size" -le "$AAR_BUDGET_BYTES"
          unzip -q "$aar" -d "$RUNNER_TEMP/aar"
          unzip -l "$RUNNER_TEMP/aar/classes.jar" | grep -q 'META-INF/alpha2/rust-crate-licenses.md'
          # Devices with 16 KB pages load only libraries whose segments are 16 KB aligned.
          readelf=$(ls "$ANDROID_NDK_LATEST_HOME"/toolchains/llvm/prebuilt/*/bin/llvm-readelf | head -n 1)
          for abi in arm64-v8a x86_64; do
            "$readelf" -lW "$RUNNER_TEMP/aar/jni/$abi/libalpha2_mobile.so" |
              awk -v abi="$abi" '$1 == "LOAD" { seen = 1; if ($NF != "0x4000") bad = 1 }
                END { if (!seen || bad) { print abi ": LOAD segments are not 16 KB aligned"; exit 1 } }'
          done
          (cd "$library/build/native" && zip -qr "$OLDPWD/$out/alpha2-android-$VERSION-symbols.zip" .)
          ls -la "$out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alpha2-android
          if-no-files-found: error
          path: target/alpha2-mobile

  swift:
    name: Swift package
    needs: [validate, version]
    if: >-
      ${{ always() && needs.version.result == 'success' &&
      (needs.validate.result == 'success' || (inputs.skip-validate && needs.validate.result == 'skipped')) }}
    runs-on: macos-26
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Over budget: raise the number.
      XCFRAMEWORK_ZIP_BUDGET_BYTES: "72000000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain, the iOS targets and cargo-about
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          cargo install cargo-about --version 0.9.2 --locked --features cli
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build the package
        run: |
          node scripts/crate-licenses.mjs --target aarch64-apple-ios \
            --out "$RUNNER_TEMP/rust-crate-licenses.md" alpha2-mobile
          ALPHA2_NOTICES="$RUNNER_TEMP/rust-crate-licenses.md" scripts/build-ios.sh
      - name: Archive the XCFramework and the package
        run: |
          out="$PWD/target/alpha2-mobile"
          mkdir -p "$out"
          cd packages/alpha2-swift
          zip="$out/Alpha2FFI-$VERSION.xcframework.zip"
          ditto -c -k --keepParent Alpha2FFI.xcframework "$zip"
          size=$(stat -f %z "$zip")
          echo "$zip: $size bytes (budget $XCFRAMEWORK_ZIP_BUDGET_BYTES)"
          test "$size" -le "$XCFRAMEWORK_ZIP_BUDGET_BYTES"
          swift package compute-checksum "$zip" > "$zip.checksum"
          cat "$zip.checksum"
          zip -qry "$out/alpha2-swift-$VERSION.zip" Package.swift Sources Alpha2FFI.xcframework
          ls -la "$out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alpha2-swift
          if-no-files-found: error
          path: target/alpha2-mobile

  distribute:
    name: Distribute ${{ matrix.target }}
    # distribute.sh hashes the archive for the alpha2 wheel pin, so any step that changes the
    # archive's bytes must run before it.
    needs: [version, package]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.package.result == 'success' }}
    runs-on: >-
      ${{ fromJSON('{"linux-x64":"ubuntu-22.04","linux-arm64":"ubuntu-24.04-arm","macos-arm64":"macos-26","win-x64":"windows-2025"}')[matrix.target] }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [linux-x64, linux-arm64, macos-arm64, win-x64]
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - run: pipx install uv==0.9.17

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: alpha2-native-${{ matrix.target }}
          path: target/package-archives

      - name: Pin the archive and build the wheels from it
        run: scripts/release/distribute.sh "${{ matrix.target }}" target/package-archives/alpha2-*-bundled.*

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            target/alpha2-dist/${{ matrix.target }}/alpha2-*-bundled.*
            target/alpha2-dist/${{ matrix.target }}/wheels/*.whl

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alpha2-dist-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7
          path: target/alpha2-dist/${{ matrix.target }}

  pin-node:
    name: Pin the archives in the Node package
    needs: [validate, version, distribute]
    if: >-
      ${{ !cancelled() && needs.validate.result == 'success' && needs.version.result == 'success' &&
      needs.distribute.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/release
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: alpha2-npm-packages
          path: npm-packages
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: alpha2-dist-*
          path: dist
          merge-multiple: true
      - name: Write the archive pins into the @alpha2-sh/node tarball
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: scripts/release/pin-node.sh "npm-packages/alpha2-sh-node-$VERSION.tgz" dist npm-pinned
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alpha2-npm-node-pinned
          if-no-files-found: error
          retention-days: 7
          path: npm-pinned/*.tgz

  publish-crates:
    name: Publish crates
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [version, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native media build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          libasound2-dev pkg-config clang
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Pin the FFmpeg SDK that the hardware decode shim builds against
        run: |
          sdk_root="$(scripts/fetch-ffmpeg-sdk.sh linux-x64)"
          {
            echo "PKG_CONFIG_PATH=$sdk_root/lib/pkgconfig"
            echo "FFMPEG_PKG_CONFIG_PATH=$sdk_root/lib/pkgconfig"
            echo "FFMPEG_LINK_MODE=dynamic"
            echo "LD_LIBRARY_PATH=$sdk_root/lib"
          } >> "$GITHUB_ENV"
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish the crates not on crates.io at this version
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          crates="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.publish == null) | .name')"
          published=()
          for name in $crates; do
            case "${#name}" in
              1) path="1/$name" ;;
              2) path="2/$name" ;;
              3) path="3/${name:0:1}/$name" ;;
              *) path="${name:0:2}/${name:2:2}/$name" ;;
            esac
            status="$(curl -sS -o "$RUNNER_TEMP/index" -w '%{http_code}' "https://index.crates.io/$path")"
            case "$status" in
              200) if jq -n -e --arg want "$VERSION" 'any(inputs; .vers == $want)' "$RUNNER_TEMP/index" > /dev/null; then
                     published+=(--exclude "$name")
                     echo "$name $VERSION is on crates.io; skipped"
                   fi ;;
              404) ;;
              *) echo "::error::the crates.io index answered $status for $name"; exit 1 ;;
            esac
          done
          if (( ${#published[@]} / 2 == $(wc -w <<< "$crates") )); then
            echo "every crate is on crates.io at $VERSION"
            exit 0
          fi
          cargo publish --locked --workspace "${published[@]}"

  publish-npm:
    name: Publish npm packages
    # Crates go first so npm and PyPI never get a release whose crates failed.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [version, pin-node, publish-crates]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            package.json
            packages/*/package.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.21.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: alpha2-npm-packages
          path: npm-packages
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: alpha2-npm-node-pinned
          path: npm-pinned
      - run: cp -f npm-pinned/*.tgz npm-packages/
      - name: Publish the npm packages not on npm at this version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          dist_tag=latest
          if [[ "$VERSION" == *-* ]]; then dist_tag=next; fi
          for manifest in $(jq -r '.workspaces[] + "/package.json"' package.json); do
            name="$(jq -r .name "$manifest")"
            tarball="./npm-packages/$(jq -r '.name | ltrimstr("@") | gsub("/"; "-")' "$manifest")-$VERSION.tgz"
            test -f "$tarball" || { echo "::error::no $tarball in the CI artifact"; exit 1; }
            if [[ -n "$(npm view "$name@$VERSION" version 2> /dev/null)" ]]; then
              echo "$name@$VERSION is on npm; skipped"
              continue
            fi
            npm publish "$tarball" --provenance --access public --tag "$dist_tag"
          done

  publish-pypi:
    name: Publish Python packages
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [version, distribute, publish-crates]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # PyPI trusted publishing is bound to this workflow file and environment.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: alpha2-dist-*
          path: dist
          merge-multiple: true
      - name: Publish the wheels not on PyPI at this version
        working-directory: dist
        run: |
          pipx install uv==0.9.17
          ls -l wheels
          # All wheels or none: alpha2 pins the same-version host on these four platforms.
          test "$(ls wheels/alpha2_host-*.whl | wc -l)" -eq 4
          test "$(ls wheels/alpha2-*.whl | wc -l)" -eq 4
          # Host first, so an alpha2 never lacks its pinned host. Reruns skip existing files.
          for wheels in "wheels/alpha2_host-*.whl" "wheels/alpha2-*.whl"; do
            # shellcheck disable=SC2086
            uv publish --trusted-publishing always --check-url https://pypi.org/simple/ $wheels
          done

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [publish-crates, publish-npm, publish-pypi]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: release/ffmpeg-lgpl/manifest.toml
          sparse-checkout-cone-mode: false

      - name: Read the FFmpeg source location and the Linux glibc floor from the lock file
        id: ffmpeg
        run: |
          manifest=release/ffmpeg-lgpl/manifest.toml
          scalar() { awk -F ' *= *' -v key="$1" '$1 == key { gsub(/"/, "", $2); print $2; exit }' "$manifest"; }
          repository="$(scalar repository)"
          release_tag="$(scalar release_tag)"
          ffmpeg_version="$(scalar ffmpeg_version)"
          test -n "$repository" && test -n "$release_tag" && test -n "$ffmpeg_version"
          echo "source_url=https://github.com/$repository/releases/download/$release_tag/ffmpeg-$ffmpeg_version.tar.xz" >> "$GITHUB_OUTPUT"
          linux_minimum_os="$(awk -F ' *= *' '
            $0 == "[assets.linux-x64]" { active = 1; next }
            active && /^\[/ { exit }
            active && $1 == "minimum_os" { gsub(/"/, "", $2); print $2; exit }' "$manifest")"
          test -n "$linux_minimum_os"
          echo "linux_minimum_os=$linux_minimum_os" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: alpha2-dist-*
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum -- *.zip *.tar.gz > checksums.sha256

      - name: Publish release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: alpha2 ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Native archives are dynamically linked to the pinned LGPL FFmpeg 8
            runtime, which each archive includes as replaceable shared libraries.
            To use a system FFmpeg 8 instead, build alpha2-host from source
            (`cargo install alpha2-host`).

            Linux archives need ${{ steps.ffmpeg.outputs.linux_minimum_os }} or later and do not run on musl
            (Alpine). The macOS archive is ad-hoc signed and not notarized: a copy
            downloaded with a browser is quarantined, and macOS holds every program
            and library in it until the quarantine is removed
            (`xattr -dr com.apple.quarantine <unpacked folder>`). Installs through
            `npx @alpha2-sh/node install` or `python -m alpha2 install` are not
            quarantined.

            Those installers check the archive against the SHA-256 that the npm
            package and the Python wheel of this version pin, also when it comes
            from a mirror. Every archive and wheel has a build provenance
            attestation; check a downloaded archive with
            `gh attestation verify <archive> --repo ${{ github.repository }}`.

            Every archive includes license notices, the exact FFmpeg runtime
            lock, build audit, dynamic dependency report, and source location.

            Corresponding FFmpeg source: ${{ steps.ffmpeg.outputs.source_url }}
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/checksums.sha256
