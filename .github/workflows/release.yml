name: Release

on:
  workflow_dispatch:
    inputs:
      skip-validate:
        description: Build the archives without running the CI gate first
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    if: ${{ !inputs.skip-validate }}
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.match.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Match the tag, the crates and the npm packages to one version
        id: match
        run: |
          shopt -s inherit_errexit
          section_values() {
            awk -v section="$1" -v pattern="$2" '
              /^\[/ { in_section = ($0 == "[" section "]"); next }
              in_section && match($0, pattern) {
                value = substr($0, RSTART, RLENGTH); sub(/^[^"]*"/, "", value); sub(/".*$/, "", value)
                print $1 " " value
              }' Cargo.toml
          }
          version="$(section_values workspace.package '^version = "[^"]*"' | awk '{ print $2 }')"
          test -n "$version"
          mismatches="$(
            section_values workspace.dependencies 'version = "[^"]*", path = ' |
              awk -v want="$version" '$2 != want { print "Cargo.toml workspace.dependencies " $1 " " $2 }'
            names="$(jq -r '.workspaces[] + "/package.json"' package.json | xargs jq -s '[.[].name]')"
            for manifest in $(jq -r '.workspaces[] + "/package.json"' package.json); do
              jq -r --arg want "$version" --argjson names "$names" --arg manifest "$manifest" '
                (select(.version != $want) | "\($manifest) version \(.version)"),
                (.dependencies, .peerDependencies, .devDependencies, .optionalDependencies
                  | to_entries? // [] | .[]
                  | select((.key as $name | $names | index($name)) and .value != $want)
                  | "\($manifest) \(.key) \(.value)")' "$manifest"
            done
          )"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            mismatches+=$'\n'"tag $GITHUB_REF_NAME"
          fi
          if [[ -n "${mismatches//$'\n'/}" ]]; then
            echo "::error::not at the workspace version $version (npm run version:set -- <version>):"
            sed '/^$/d' <<< "$mismatches"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  package:
    name: Package ${{ matrix.target }}
    needs: [validate, version]
    if: >-
      ${{ always() && needs.version.result == 'success' &&
      (needs.validate.result == 'success' || (inputs.skip-validate && needs.validate.result == 'skipped')) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-22.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-arm64
            runner: macos-26
          - target: win-x64
            runner: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - run: cargo install cargo-about --version 0.9.2 --locked --features cli

      - name: Install Linux packaging tools
        if: startsWith(matrix.target, 'linux-')
        run: sudo apt-get update && sudo apt-get install --yes pkg-config unzip

      - name: Install macOS packaging tools
        if: startsWith(matrix.target, 'macos-')
        run: brew install pkg-config

      - name: Build native archives
        run: scripts/build-native-release.sh all "${{ matrix.target }}"

      - name: Upload native archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alpha2-native-${{ matrix.target }}
          if-no-files-found: error
          path: target/alpha2-native-release/archives/*

      # The Python wheels of this target: `alpha2-host` repackages the bundled archive just built,
      # and `alpha2` is the abi3 extension module with the client, which depends on it. Not
      # published here.
      - name: Build Python wheels
        run: |
          pipx install uv==0.9.17
          uv run --no-project --python 3.12 python/alpha2-host/build_wheel.py \
            target/alpha2-native-release/archives/alpha2-*-bundled.* target/python-wheels
          # From the package directory: maturin takes the name, metadata and crate from its
          # pyproject.toml, which a bare --manifest-path would skip.
          (cd python/alpha2 && uvx maturin@1.15.0 build --release --out ../../target/python-wheels)
          ls -l target/python-wheels

      # From the two wheels alone, `pip install alpha2` brings the host it pins, and the client
      # finds it inside the alpha2-host package, which starts with the libraries beside it.
      - name: Install the Python wheels and find the host
        run: |
          check="$RUNNER_TEMP/wheel-check"
          uv venv --python 3.11 "$check"
          uv pip install --python "$check" --no-index --find-links target/python-wheels alpha2
          python="$check/bin/python"
          [ -d "$check/Scripts" ] && python="$check/Scripts/python"
          host="$("$python" -c '
          import pathlib, alpha2, alpha2_host
          found = alpha2.resolve_host_binary()
          assert found == pathlib.Path(alpha2_host.host_path()), found
          print(found)')"
          { "$host" 2>&1 || true; } | grep "usage: alpha2-host"

      - name: Upload Python wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alpha2-python-${{ matrix.target }}
          if-no-files-found: error
          path: target/python-wheels/*.whl

  publish-crates:
    name: Publish crates
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install native media build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          libavcodec-dev libavformat-dev libavutil-dev libswresample-dev
          libswscale-dev libasound2-dev pkg-config clang
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Pin the FFmpeg SDK that the hardware decode shim builds against
        run: |
          sdk_root="$(scripts/fetch-ffmpeg-sdk.sh linux-x64)"
          {
            echo "PKG_CONFIG_PATH=$sdk_root/lib/pkgconfig"
            echo "FFMPEG_PKG_CONFIG_PATH=$sdk_root/lib/pkgconfig"
            echo "FFMPEG_LINK_MODE=dynamic"
            echo "LD_LIBRARY_PATH=$sdk_root/lib"
          } >> "$GITHUB_ENV"
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish the crates not on crates.io at this version
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          crates="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.publish == null) | .name')"
          published=()
          for name in $crates; do
            case "${#name}" in
              1) path="1/$name" ;;
              2) path="2/$name" ;;
              3) path="3/${name:0:1}/$name" ;;
              *) path="${name:0:2}/${name:2:2}/$name" ;;
            esac
            status="$(curl -sS -o "$RUNNER_TEMP/index" -w '%{http_code}' "https://index.crates.io/$path")"
            case "$status" in
              200) if jq -n -e --arg want "$VERSION" 'any(inputs; .vers == $want)' "$RUNNER_TEMP/index" > /dev/null; then
                     published+=(--exclude "$name")
                     echo "$name $VERSION is on crates.io; skipped"
                   fi ;;
              404) ;;
              *) echo "::error::the crates.io index answered $status for $name"; exit 1 ;;
            esac
          done
          if (( ${#published[@]} / 2 == $(wc -w <<< "$crates") )); then
            echo "every crate is on crates.io at $VERSION"
            exit 0
          fi
          cargo publish --locked --workspace "${published[@]}"

  publish-npm:
    name: Publish npm packages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: |
            package.json
            packages/*/package.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.21.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: alpha2-npm-packages
          path: npm-packages
      - name: Publish the npm packages not on npm at this version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          dist_tag=latest
          if [[ "$VERSION" == *-* ]]; then dist_tag=next; fi
          for manifest in $(jq -r '.workspaces[] + "/package.json"' package.json); do
            name="$(jq -r .name "$manifest")"
            tarball="./npm-packages/$(jq -r '.name | ltrimstr("@") | gsub("/"; "-")' "$manifest")-$VERSION.tgz"
            test -f "$tarball" || { echo "::error::no $tarball in the CI artifact"; exit 1; }
            if [[ -n "$(npm view "$name@$VERSION" version 2> /dev/null)" ]]; then
              echo "$name@$VERSION is on npm; skipped"
              continue
            fi
            npm publish "$tarball" --provenance --access public --tag "$dist_tag"
          done

  publish-pypi:
    name: Publish Python packages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # PyPI trusts this workflow (release.yml) in this environment for `alpha2` and `alpha2-host`.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: alpha2-python-*
          path: wheels
          merge-multiple: true
      - name: Publish the wheels not on PyPI at this version
        run: |
          pipx install uv==0.9.17
          ls -l wheels
          # Every target's alpha2-host wheel and alpha2 wheel, or nothing: alpha2 pins the host of
          # its own version on these four platforms.
          test "$(ls wheels/alpha2_host-*.whl | wc -l)" -eq 4
          test "$(ls wheels/alpha2-*.whl | wc -l)" -eq 4
          # The host first, so no moment has an alpha2 whose pinned host is missing. A file already
          # on PyPI (a rerun) is skipped.
          for wheels in "wheels/alpha2_host-*.whl" "wheels/alpha2-*.whl"; do
            # shellcheck disable=SC2086
            uv publish --trusted-publishing always --check-url https://pypi.org/simple/ $wheels
          done

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish-crates, publish-npm, publish-pypi]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: release/ffmpeg-lgpl/manifest.toml
          sparse-checkout-cone-mode: false

      - name: Read the FFmpeg source location from the lock file
        id: ffmpeg
        run: |
          manifest=release/ffmpeg-lgpl/manifest.toml
          scalar() { awk -F ' *= *' -v key="$1" '$1 == key { gsub(/"/, "", $2); print $2; exit }' "$manifest"; }
          repository="$(scalar repository)"
          release_tag="$(scalar release_tag)"
          ffmpeg_version="$(scalar ffmpeg_version)"
          test -n "$repository" && test -n "$release_tag" && test -n "$ffmpeg_version"
          echo "source_url=https://github.com/$repository/releases/download/$release_tag/ffmpeg-$ffmpeg_version.tar.xz" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: alpha2-native-*
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum -- *.zip *.tar.gz > checksums.sha256

      - name: Publish release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: alpha2 ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Native archives are dynamically linked to the pinned LGPL FFmpeg 8
            runtime. `bundled` archives include the replaceable shared runtime;
            `thin` archives (Linux and macOS) require an ABI-compatible system
            FFmpeg 8 install; on macOS they look in /opt/homebrew/lib,
            /usr/local/lib and /opt/local/lib. Windows ships `bundled` only.

            Every archive includes license notices, the exact FFmpeg runtime
            lock, build audit, dynamic dependency report, and source location.

            Corresponding FFmpeg source: ${{ steps.ffmpeg.outputs.source_url }}
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/checksums.sha256
