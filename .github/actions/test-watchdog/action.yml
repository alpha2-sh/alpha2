name: Test watchdog
description: Builds the cargo test runner that stops a stuck test binary, and makes cargo run tests through it.
runs:
  using: composite
  steps:
    - name: Install gdb for the stacks of a stuck test
      if: runner.os == 'Linux'
      shell: bash
      run: |
        command -v gdb > /dev/null ||
          { timeout 300 sudo apt-get -o Acquire::Retries=3 update &&
            timeout 300 sudo apt-get -o Acquire::Retries=3 install --yes gdb; }
    - name: Build the test watchdog
      shell: bash
      run: |
        cargo build --locked -p alpha2-test-support --bin alpha2-test-watchdog
        triple="$(rustc -vV | sed -n 's/^host: //p')"
        runner="$GITHUB_WORKSPACE/target/debug/alpha2-test-watchdog"
        if [ "$RUNNER_OS" = Windows ]; then runner="$(cygpath -m "$runner").exe"; fi
        echo "CARGO_TARGET_$(echo "$triple" | tr 'a-z-' 'A-Z_')_RUNNER=$runner" | tee -a "$GITHUB_ENV"
