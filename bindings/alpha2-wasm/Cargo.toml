[package]
name = "alpha2-wasm"
version.workspace = true
description = "Shared web preview and export wasm binding for alpha2."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["wasm", "webgpu", "video", "video-editing"]
categories = ["wasm", "multimedia::video"]
# Tests, test-only modules, benches and fixtures stay in the repository, where `cargo test` runs.
include = [
  "/src/**",
  "/README.md",
  "/LICENSE.md",
  "!/src/**/tests.rs",
  "!/src/**/*_tests.rs",
  "!/src/**/tests/**",
]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
alpha2-assets.workspace = true
alpha2-audio.workspace = true
alpha2-engine = { workspace = true, features = ["wgpu-interop"] }
alpha2-eval.workspace = true
alpha2-geometry.workspace = true
alpha2-gpu = { workspace = true, features = ["wgpu-interop"] }
alpha2-media.workspace = true
alpha2-model.workspace = true
alpha2-render = { workspace = true, features = ["wgpu-interop"] }
alpha2-shaders.workspace = true
alpha2-text.workspace = true
alpha2-time.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { version = "0.3.105", features = ["Event", "EventTarget", "HtmlCanvasElement", "ImageBitmap", "OffscreenCanvas", "VideoColorSpace", "VideoFrame", "VideoTransferCharacteristics", "console"] }
wgpu = { workspace = true, features = ["webgl"] }

[dev-dependencies]
alpha2-scaling-support.workspace = true
# The audio contract only: the visual one (a default feature) turns the extension providers on.
alpha2-provider-contract = { workspace = true, default-features = false }

[lints]
workspace = true
