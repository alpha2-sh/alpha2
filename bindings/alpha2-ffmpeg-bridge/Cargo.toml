[package]
name = "alpha2-ffmpeg-bridge"
version.workspace = true
description = "Small audited unsafe boundary for FFmpeg buffers used by alpha2-native."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["ffmpeg", "video", "ffi", "vulkan"]
categories = ["multimedia::video", "external-ffi-bindings"]
# Tests and fixtures stay out of the published package.
include = [
  "/build.rs",
  "/src/**",
  "/include/**",
  "/README.md",
  "/LICENSE.md",
  "!/src/**/tests.rs",
  "!/src/**/*_tests.rs",
  "!/src/**/tests/**",
]
build = "build.rs"

# docs.rs compiles no C shim, so the hardware-device API can be documented there.
[package.metadata.docs.rs]
features = ["hwdevice"]

[features]
default = []
# C shims for native GPU interop with FFmpeg hardware devices (hardware decode and encode).
hwdevice = []

[build-dependencies]
alpha2-build-support.workspace = true

[dependencies]
alpha2-media.workspace = true
bytes.workspace = true
rsmpeg = { version = "0.18.0", features = ["link_system_ffmpeg"] }

[dev-dependencies]
alpha2-test-support.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
