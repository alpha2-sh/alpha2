[package]
name = "alpha2-text"
version.workspace = true
description = "Portable text shaping and rasterization for alpha2 hosts, native and wasm."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["text", "shaping", "rasterization", "captions", "wasm"]
categories = ["text-processing", "rendering"]
include = [
  "/src/**",
  "/README.md",
  "/LICENSE.md",
  "!/src/**/tests.rs",
  "!/src/**/*_tests.rs",
  "!/src/**/tests/**",
]

[dependencies]
alpha2-media.workspace = true
# Without `std`, x86 cannot pick a SIMD line drawer at run time, so native and wasm glyphs match.
ab_glyph_rasterizer = { version = "0.1.10", default-features = false, features = ["libm"] }
# `libm`'s `atan2f` for sweep gradients, so color glyphs match across targets.
libm = "0.2.16"
png.workspace = true
rustybuzz = "0.20.1"
unicode-bidi = "0.3.18"
unicode-linebreak = "0.1.5"
# NFC so family names match regardless of normalization.
unicode-normalization = "0.1.25"
unicode-script = "0.5.8"
unicode-segmentation = "1.13.3"

[lints]
workspace = true

[dev-dependencies]
alpha2-scaling-support.workspace = true
# Exact float parsing so pinned f32 metrics round-trip.
serde_json = { workspace = true, features = ["float_roundtrip"] }

[[bench]]
name = "caption_raster"
harness = false
