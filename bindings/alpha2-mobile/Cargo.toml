[package]
name = "alpha2-mobile"
version.workspace = true
description = "The alpha2 API for iOS and Android apps, as Swift and Kotlin bindings generated with uniffi."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["video", "ios", "android", "mobile"]
categories = ["multimedia::video", "api-bindings"]
publish = false

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
alpha2-container.workspace = true
alpha2-engine.workspace = true
alpha2-extensions = { workspace = true, features = ["svg", "animated-image", "image-sequence", "lottie", "exr", "latex", "pdf"] }
alpha2-gpu.workspace = true
alpha2-host-core = { workspace = true, features = ["cpal-host", "engine", "providers"] }
alpha2-media.workspace = true
alpha2-model.workspace = true
alpha2-os.workspace = true
alpha2-render.workspace = true
alpha2-text.workspace = true
alpha2-time.workspace = true
pollster.workspace = true
serde_json.workspace = true
thiserror = "2.0.20"
wgpu.workspace = true
uniffi = "=0.32.2"

[dev-dependencies]
alpha2-test-support.workspace = true

[target.'cfg(target_vendor = "apple")'.dependencies]
alpha2-apple-media.workspace = true

[target.'cfg(target_os = "ios")'.dev-dependencies]
objc2 = "0.6.5"
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "CAMetalLayer"] }

[target.'cfg(target_os = "android")'.dependencies]
alpha2-android-media.workspace = true
alpha2-native-gpu = { workspace = true, features = ["ahb-import"] }
jni = "0.21"
ndk-context = "0.1"
ndk-sys = { version = "=0.6.0", features = ["media", "nativewindow"] }

# Workspace lints, but `unsafe_code` is deny (not forbid): the scaffolding uniffi generates at the
# crate root and at every exported item needs it, so lib.rs allows it crate-wide; the hand-written
# unsafe code (JNI exports, native windows, decoder buffer import) carries SAFETY comments.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
