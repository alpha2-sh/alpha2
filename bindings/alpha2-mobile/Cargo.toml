[package]
name = "alpha2-mobile"
version.workspace = true
description = "The alpha2 API for iOS and Android apps, as Swift and Kotlin bindings generated with uniffi."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["video", "ios", "android", "mobile"]
categories = ["multimedia::video", "api-bindings"]
publish = false

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
default = []
# The `uniffi-bindgen` tool that writes the Swift and Kotlin sources.
bindgen = ["uniffi/cli"]

[dependencies]
alpha2-extensions = { workspace = true, features = ["svg", "animated-image", "image-sequence", "lottie", "exr", "latex", "pdf"] }
alpha2-gpu.workspace = true
alpha2-host-core.workspace = true
alpha2-media.workspace = true
alpha2-model.workspace = true
alpha2-os.workspace = true
alpha2-text.workspace = true
pollster.workspace = true
serde_json.workspace = true
thiserror = "2.0.20"
uniffi = "=0.32.2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
ndk-sys = { version = "=0.6.0", features = ["nativewindow"] }

# Workspace lints, but `unsafe_code` is deny (not forbid): the uniffi scaffolding and the Android
# JNI exports allow it where they need it.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
