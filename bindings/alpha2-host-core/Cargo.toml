[package]
name = "alpha2-host-core"
version.workspace = true
description = "FFmpeg-free native host logic for alpha2: the policies, audio timelines, cursor rules, providers, plugin runtime and protocol frames every native host shares, and the decode, export and still pipeline the mobile hosts run."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["video", "audio", "host", "mobile"]
categories = ["multimedia::video", "multimedia::audio"]
include = [
  "/src/**",
  "/build.rs",
  "/README.md",
  "/LICENSE.md",
  "!/src/**/tests.rs",
  "!/src/**/*_tests.rs",
  "!/src/**/tests/**",
]

[features]
default = ["engine"]
engine = ["dep:alpha2-engine", "dep:alpha2-eval", "dep:alpha2-model", "dep:alpha2-render", "dep:wgpu"]
providers = ["engine", "dep:alpha2-extensions", "dep:bytemuck"]
cpal-host = ["dep:cpal"]
# Runs extractor plugins, wasm modules through wasmtime and native ones through the platform loader.
plugins = ["engine", "dep:alpha2-plugin-abi", "dep:libloading", "dep:sha2", "dep:wasmtime"]
# Thread-local decode budget overrides for dependents' tests. Never enable in a product build.
test-hooks = []

[dependencies]
alpha2-audio.workspace = true
alpha2-container.workspace = true
alpha2-engine = { workspace = true, optional = true }
alpha2-extensions = { workspace = true, optional = true }
alpha2-eval = { workspace = true, optional = true }
alpha2-media.workspace = true
alpha2-model = { workspace = true, optional = true }
alpha2-os.workspace = true
alpha2-plugin-abi = { workspace = true, optional = true }
alpha2-render = { workspace = true, optional = true }
alpha2-time.workspace = true
bytemuck = { version = "1.25.2", optional = true }
bytes.workspace = true
image-webp = "0.2.4"
libloading = { version = "0.8.9", optional = true }
png.workspace = true
serde_json.workspace = true
sha2 = { version = "0.11", optional = true }
wasmtime = { version = "50.0.1", optional = true, default-features = false, features = ["cranelift", "pulley", "reexport-wasmparser", "runtime", "std"] }
wgpu = { workspace = true, optional = true }
zune-core = "0.5.3"
zune-jpeg = "0.5.15"
cpal = { version = "0.17.3", optional = true }

[dev-dependencies]
alpha2-engine = { workspace = true, features = ["extract-fixtures"] }

# The workspace's lints, with unsafe code denied rather than forbidden, because the plugin loader
# calls into native plugins and allows it there alone.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
