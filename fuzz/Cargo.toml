[package]
name = "alpha2-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
alpha2-audio = { path = "../crates/alpha2-audio" }
alpha2-engine = { path = "../crates/alpha2-engine" }
alpha2-eval = { path = "../crates/alpha2-eval" }
alpha2-extensions = { path = "../extensions" }
alpha2-geometry = { path = "../crates/alpha2-geometry" }
alpha2-media = { path = "../crates/alpha2-media" }
alpha2-model = { path = "../crates/alpha2-model" }
alpha2-render = { path = "../crates/alpha2-render" }
alpha2-text = { path = "../bindings/alpha2-text" }
alpha2-time = { path = "../crates/alpha2-time" }
libfuzzer-sys = "0.4"
serde_json = "1.0.149"
typed-arena = "2"

[[bin]]
name = "project_from_json"
path = "fuzz_targets/project_from_json.rs"
