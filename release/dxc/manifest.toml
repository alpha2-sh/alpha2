name = "directx-shader-compiler"
# Microsoft's DirectX Shader Compiler, which the Windows host loads to compile its DX12 pipelines:
# FXC, built into Windows, takes seconds for the composite pipeline at the first frame of every
# process. Release v1.9.2609 (published 2026-09-29), from
# https://github.com/microsoft/DirectXShaderCompiler/releases/tag/v1.9.2609, pinned 2026-10-31.
# The fetch refuses an archive or a file whose SHA-256 differs.
version = "1.9.2609"
download_url = "https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2609"
archive = "dxc_2026_09_29.zip"
archive_sha256 = "ad31b1fc8443175d204f77a611fdb3ef2ec42759bdc2f1167368de24a4a7e7f1"

# The files kept from the archive (paths inside it, with forward slashes), each with its SHA-256.
# `dxcompiler.dll` imports only Windows system DLLs.
