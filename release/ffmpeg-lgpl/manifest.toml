schema = 2
name = "alpha2-ffmpeg-lgpl-runtime"
repository = "alpha2-sh/ffmpeg-builds"
release_tag = "ffmpeg-8.1.3-shared-build4"
ffmpeg_version = "8.1.3"
source_tag = "n8.1.3"
source_url = "https://ffmpeg.org/releases/ffmpeg-8.1.3.tar.xz"
signature_url = "https://ffmpeg.org/releases/ffmpeg-8.1.3.tar.xz.asc"
source_sha256 = "7138d28c96d9d3e3af4ee3d8cad72741f8ffb40da90c1112235dea3ecd3178a3"
signing_key_fingerprint = "FCF986EA15E6E293A5644F10B4322F04D67658D8"
license = "LGPL-2.1-or-later"
# Upstream fixes the SDK applies to source_tag, in order. Each file is a release asset of
# release_tag and part of the corresponding source; the runtime still reports source_tag.
patches = [
  { file = "0001-avcodec-h264-free-private-HW-data-early-0661ef6bb3e5.patch", upstream = "0661ef6bb3e50f502e79d3c5fea1c83e860f1d09", sha256 = "345e4a1c9b71b6bb6d3bfdab282c239ab565c2914fe00ad049a5fbf5d481f6cf" },
  { file = "0002-vulkan_encode-destroy-queued-picture-views-ddfa842088cd.patch", upstream = "ddfa842088cd86bd48bc4533f10a4b5badcbd02d", sha256 = "5d4731d387e458d5e35a4b26bcd67bf30330b6eace60892bdda39f5eebf2410d" },
]

required_configure = [
  "--disable-gpl",
  "--disable-nonfree",
  "--disable-version3",
  "--disable-autodetect",
  "--disable-programs",
  "--disable-static",
  "--enable-shared",
  "--enable-pic",
  "--enable-runtime-cpudetect",
  "--disable-iconv",
  "--enable-zlib",
  "--enable-libdav1d",
  "--enable-libopus",
  "--enable-libvpx",
  "--enable-libsvtav1",
]
# `cuda-nvcc`, `cuda-sdk` and `libnpp` are FFmpeg's nonfree NVIDIA components. NVENC is not one:
# it loads the NVIDIA driver at run time, and the Linux and Windows builds enable it
# (`verify-runtime.sh` requires it there).
forbidden_configure = [
  "--enable-gpl",
  "--enable-nonfree",
  "--enable-version3",
  "--enable-static",
  "--enable-libx264",
  "--enable-libx265",
  "--enable-libxvid",
  "--enable-libfdk-aac",
  "--enable-libvmaf",
  "--enable-mbedtls",
  "--enable-cuda-nvcc",
  "--enable-cuda-sdk",
  "--enable-libnpp",
]

libraries_linux = [
  "libavcodec.so.62",
  "libavdevice.so.62",
  "libavfilter.so.11",
  "libavformat.so.62",
  "libavutil.so.60",
  "libswresample.so.6",
  "libswscale.so.9",
]
libraries_macos = [
  "libavcodec.62.dylib",
  "libavdevice.62.dylib",
  "libavfilter.11.dylib",
  "libavformat.62.dylib",
  "libavutil.60.dylib",
  "libswresample.6.dylib",
  "libswscale.9.dylib",
]
libraries_windows = [
  "avcodec-62.dll",
  "avdevice-62.dll",
  "avfilter-11.dll",
  "avformat-62.dll",
  "avutil-60.dll",
  "swresample-6.dll",
  "swscale-9.dll",
]
headers = [
  "libavcodec",
  "libavdevice",
  "libavfilter",
  "libavformat",
  "libavutil",
  "libswresample",
  "libswscale",
]
pkg_config = [
  "libavcodec.pc",
  "libavdevice.pc",
  "libavfilter.pc",
  "libavformat.pc",
  "libavutil.pc",
  "libswresample.pc",
  "libswscale.pc",
]
notices = [
  "licenses/FFmpeg/COPYING.LGPLv2.1",
  "licenses/FFmpeg/COPYING.LGPLv3",
  "licenses/FFmpeg/LICENSE.md",
  "licenses/FFmpeg/CREDITS",
  "licenses/zlib/LICENSE",
  "licenses/dav1d/COPYING",
  "licenses/opus/COPYING",
  "licenses/libvpx/LICENSE",
  "licenses/libvpx/AUTHORS",
  "licenses/libvpx/PATENTS",
  "licenses/SVT-AV1/LICENSE.md",
  "licenses/SVT-AV1/PATENTS.md",
]
# Only the Linux builds compile against the Vulkan headers, and only the Linux and Windows builds
# against nv-codec-headers (NVENC), so only they carry those notices. macOS uses VideoToolbox.
notices_linux = [
  "licenses/Vulkan-Headers/LICENSE.md",
  "licenses/Vulkan-Headers/LICENSES/Apache-2.0.txt",
  "licenses/Vulkan-Headers/LICENSES/MIT.txt",
  "licenses/nv-codec-headers/LICENSE",
]
notices_windows = [
  "licenses/nv-codec-headers/LICENSE",
]

