signing_key_fingerprint = "FCF986EA15E6E293A5644F10B4322F04D67658D8"
license = "LGPL-2.1-or-later"
# Fixes applied to source_tag in order; the runtime still reports source_tag. `upstream` is the
# FFmpeg commit, or "pending" for a fix upstream does not have yet.
patches = [
  { file = "0001-avcodec-h264-free-private-HW-data-early-0661ef6bb3e5.patch", upstream = "0661ef6bb3e50f502e79d3c5fea1c83e860f1d09", sha256 = "345e4a1c9b71b6bb6d3bfdab282c239ab565c2914fe00ad049a5fbf5d481f6cf" },
  { file = "0002-vulkan_encode-destroy-queued-picture-views-ddfa842088cd.patch", upstream = "ddfa842088cd86bd48bc4533f10a4b5badcbd02d", sha256 = "5d4731d387e458d5e35a4b26bcd67bf30330b6eace60892bdda39f5eebf2410d" },
  { file = "0003-vulkan_encode-free-CBS-context-on-close-569674ac8dc0.patch", upstream = "569674ac8dc00c11eaa96d86870b186cfb076639", sha256 = "beeb8a6b33cd06916f62d6bc915e342fba2eda474565ce7958e0f46e18bca178" },
  { file = "0004-vulkan_encode-release-unoutput-packet-buffers.patch", upstream = "pending", sha256 = "b1d10bf7d61b163646c80aa31b82de1e1b306874de575b434157e20d7efb61a4" },
]

required_configure = [
  "--disable-gpl",
  "--disable-nonfree",
  "--disable-version3",
  "--disable-autodetect",
  "--disable-programs",
  "--disable-static",
  "--enable-shared",
  "--enable-pic",
  "--enable-runtime-cpudetect",
  "--disable-iconv",
  "--enable-zlib",
  "--enable-libdav1d",
  "--enable-libopus",
  "--enable-libvpx",
  "--enable-libsvtav1",
]
# `cuda-nvcc`, `cuda-sdk` and `libnpp` are nonfree. NVENC is not; it loads the driver at run time.
forbidden_configure = [
  "--enable-gpl",
  "--enable-nonfree",
  "--enable-version3",
  "--enable-static",
  "--enable-libx264",
  "--enable-libx265",
  "--enable-libxvid",
  "--enable-libfdk-aac",
  "--enable-libvmaf",
  "--enable-mbedtls",
  "--enable-cuda-nvcc",
  "--enable-cuda-sdk",
  "--enable-libnpp",
]

libraries_linux = [
  "libavcodec.so.62",
  "libavdevice.so.62",
  "libavfilter.so.11",
  "libavformat.so.62",
  "libavutil.so.60",
  "libswresample.so.6",
  "libswscale.so.9",
]
libraries_macos = [
