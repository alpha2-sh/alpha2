# Plugins and their SDK have a workspace and lock of their own, so plugin dependencies never reach
# the engine's. Nothing here is published or released from the repository.
[workspace]
members = ["sdk", "fixture-digest", "fixture-scripted", "pack", "silence"]
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
alpha2-plugin-abi = { path = "../crates/alpha2-plugin-abi" }
alpha2-plugin-sdk = { path = "sdk" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Artifacts are downloaded: no symbols, one optimized unit.
[profile.release]
overflow-checks = true
strip = true
lto = true
codegen-units = 1
