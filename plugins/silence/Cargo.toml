[package]
name = "alpha2-plugin-silence"
description = "Intervals without speech, from a voice-activity model, as an alpha2 plugin."
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
alpha2-plugin-sdk.workspace = true
serde_json.workspace = true
tract-onnx = { version = "0.23.10", default-features = false }

[dev-dependencies]
alpha2-plugin-abi.workspace = true
alpha2-plugin-sdk = { workspace = true, features = ["testing"] }

[lints]
workspace = true
