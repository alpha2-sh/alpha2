[package]
name = "alpha2-plugin-beats"
description = "Beats, onsets and an onset envelope of music, as an alpha2 plugin."
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
alpha2-plugin-sdk.workspace = true
rustfft = { version = "6.4.1", default-features = false }
serde_json.workspace = true

[dev-dependencies]
alpha2-plugin-abi.workspace = true
alpha2-plugin-sdk = { workspace = true, features = ["testing"] }

[lints]
workspace = true
