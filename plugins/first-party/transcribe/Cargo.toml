[package]
name = "alpha2-plugin-transcribe"
description = "Words with their times, from a whisper.cpp model the caller supplies, as an alpha2 plugin."
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.alpha2-plugin]
wasm = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
alpha2-plugin-sdk.workspace = true
serde_json.workspace = true
whisper-rs = { version = "0.16.0", features = ["raw-api"] }

[dev-dependencies]
alpha2-plugin-abi.workspace = true
alpha2-plugin-sdk = { workspace = true, features = ["testing"] }

[lints]
workspace = true
