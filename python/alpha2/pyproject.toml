[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "alpha2"
description = "Python client for the alpha2 video engine: build, validate, and render project documents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
# 3.11 for NotRequired and generic TypedDicts; 3.11.4 for tarfile extraction filters.
requires-python = ">=3.11.4"
dependencies = [
  "alpha2-host==0.6.0; (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'linux' and platform_machine == 'aarch64') or (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'win32' and platform_machine == 'AMD64')",
  "truststore>=0.10; sys_platform == 'darwin' or sys_platform == 'win32'",
  "certifi>=2024.2.2; sys_platform == 'linux'",
]
dynamic = ["version"]
keywords = ["video", "rendering", "video-editing", "timeline", "gpu"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Multimedia :: Video",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/alpha2-sh/alpha2"
Repository = "https://github.com/alpha2-sh/alpha2"
Issues = "https://github.com/alpha2-sh/alpha2/issues"

[project.scripts]
alpha2 = "alpha2.__main__:main"

[dependency-groups]
# CI installs the package with --no-deps, so its trust dependencies are listed here, both on every
# platform so mypy can check each branch.
dev = [
  "maturin==1.15.0",
  "mypy==2.4.0",
  "pytest==9.1.1",
  "pytest-timeout==2.4.0",
  "ruff==0.17.2",
  "truststore==0.10.5",
  "certifi==2026.10.23",
]

[tool.maturin]
manifest-path = "../../bindings/alpha2-python/Cargo.toml"
module-name = "alpha2._native"
python-source = "src"
exclude = ["src/alpha2/__pycache__/**"]
# Release pins written by scripts/release/distribute.sh; git ignores them.
include = [{ path = "src/alpha2/_host_archives.json", format = "wheel" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 180

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/alpha2/types.py", "src/alpha2/compose_types.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "A", "BLE", "RUF"]
ignore = ["A002"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
strict = true
files = ["src/alpha2"]
