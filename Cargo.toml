[workspace]
members = [
    "crates/alpha2",
    "crates/alpha2-time",
    "crates/alpha2-media",
    "crates/alpha2-model",
    "crates/alpha2-eval",
    "crates/alpha2-gpu",
    "crates/alpha2-render",
    "crates/alpha2-shaders",
    "crates/alpha2-audio",
    "crates/alpha2-engine",
    "crates/alpha2-assets",
    "crates/alpha2-geometry",
    "crates/alpha2-layout",
    "crates/alpha2-compose",
    "crates/alpha2-container",
    "extensions",
    "extensions/web",
    "extensions/pdf-web",
    "bindings/alpha2-wasm",
    "bindings/alpha2-compose-wasm",
    "bindings/alpha2-audio-worklet",
    "bindings/alpha2-build-support",
    "bindings/alpha2-ffmpeg-bridge",
    "bindings/alpha2-native",
    "bindings/alpha2-host-core",
    "bindings/alpha2-mobile",
    "bindings/alpha2-uniffi-bindgen",
    "bindings/alpha2-android-media",
    "bindings/alpha2-apple-media",
    "bindings/alpha2-native-gpu",
    "bindings/alpha2-os",
    "bindings/alpha2-text",
    "bindings/alpha2-host",
    "bindings/alpha2-python",
    "tests/alloc_budget",
    "tests/audio_determinism",
    "tests/backend_conformance",
    "tests/extension_raster_pins",
    "tests/facade_without_wgpu",
    "tests/golden_support",
    "tests/provider_contract",
    "tests/reader_conformance",
    "tests/render_determinism",
    "tests/scaling_support",
    "tests/test_support",
]
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/alpha2-sh/alpha2"

[workspace.dependencies]
bytes = "1.12.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
wgpu = "30.0.1"
pollster = "1.0.1"
png = "0.18.1"
schemars = "1.2.2"
wasm-bindgen = "=0.2.128"
js-sys = "=0.3.105"
wasm-bindgen-futures = "=0.4.78"
# Test crates have no version, so `cargo publish` drops them from dev-dependencies.
alpha2 = { version = "0.6.0", path = "crates/alpha2" }
alpha2-assets = { version = "0.6.0", path = "crates/alpha2-assets" }
alpha2-audio = { version = "0.6.0", path = "crates/alpha2-audio" }
alpha2-compose = { version = "0.6.0", path = "crates/alpha2-compose" }
alpha2-container = { version = "0.6.0", path = "crates/alpha2-container" }
alpha2-engine = { version = "0.6.0", path = "crates/alpha2-engine" }
alpha2-eval = { version = "0.6.0", path = "crates/alpha2-eval" }
alpha2-geometry = { version = "0.6.0", path = "crates/alpha2-geometry" }
alpha2-layout = { version = "0.6.0", path = "crates/alpha2-layout" }
alpha2-gpu = { version = "0.6.0", path = "crates/alpha2-gpu" }
alpha2-media = { version = "0.6.0", path = "crates/alpha2-media" }
alpha2-model = { version = "0.6.0", path = "crates/alpha2-model" }
alpha2-render = { version = "0.6.0", path = "crates/alpha2-render" }
alpha2-shaders = { version = "0.6.0", path = "crates/alpha2-shaders" }
alpha2-time = { version = "0.6.0", path = "crates/alpha2-time" }
alpha2-extensions = { version = "0.6.0", path = "extensions", default-features = false }
alpha2-build-support = { version = "0.6.0", path = "bindings/alpha2-build-support" }
alpha2-ffmpeg-bridge = { version = "0.6.0", path = "bindings/alpha2-ffmpeg-bridge" }
alpha2-native = { version = "0.6.0", path = "bindings/alpha2-native" }
alpha2-host-core = { version = "0.6.0", path = "bindings/alpha2-host-core", default-features = false }
alpha2-mobile = { version = "0.6.0", path = "bindings/alpha2-mobile" }
alpha2-android-media = { version = "0.6.0", path = "bindings/alpha2-android-media" }
alpha2-apple-media = { version = "0.6.0", path = "bindings/alpha2-apple-media" }
alpha2-native-gpu = { version = "0.6.0", path = "bindings/alpha2-native-gpu" }
alpha2-os = { version = "0.6.0", path = "bindings/alpha2-os" }
alpha2-text = { version = "0.6.0", path = "bindings/alpha2-text" }
alpha2-backend-conformance = { path = "tests/backend_conformance" }
alpha2-reader-conformance = { path = "tests/reader_conformance" }
alpha2-golden-support = { path = "tests/golden_support" }
alpha2-provider-contract = { path = "tests/provider_contract", default-features = false }
alpha2-scaling-support = { path = "tests/scaling_support" }
alpha2-test-support = { path = "tests/test_support" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
overflow-checks = true

# Every host process hashes its own binary at start; unoptimized, that takes seconds.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.digest]
opt-level = 3

[profile.dev.package.block-buffer]
opt-level = 3