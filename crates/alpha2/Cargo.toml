[package]
name = "alpha2"
version.workspace = true
description = "Facade crate for the standalone alpha2 media engine."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["video", "video-editing", "rendering", "timeline", "webgpu"]
categories = ["multimedia::video", "rendering::engine", "graphics"]
include = [
  "/src/**",
  "/README.md",
  "/LICENSE.md",
  "!/src/**/tests.rs",
  "!/src/**/*_tests.rs",
  "!/src/**/tests/**",
]

[features]
wgpu-interop = ["alpha2-engine/wgpu-interop"]

[dependencies]
alpha2-audio.workspace = true
alpha2-engine.workspace = true
alpha2-geometry.workspace = true
alpha2-gpu.workspace = true
alpha2-media.workspace = true
alpha2-model.workspace = true
alpha2-render.workspace = true
alpha2-time.workspace = true

[dev-dependencies]
alpha2-gpu = { workspace = true, features = ["serial-acquisition"] }
pollster.workspace = true

[lints]
workspace = true

[[test]]
name = "wgpu_reexport"
required-features = ["wgpu-interop"]
