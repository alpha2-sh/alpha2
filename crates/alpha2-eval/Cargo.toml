[package]
name = "alpha2-eval"
version.workspace = true
description = "Pure alpha2 timeline evaluation."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["video", "timeline", "animation", "keyframes"]
categories = ["multimedia::video"]
include = [
  "/src/**",
  "/README.md",
  "/LICENSE.md",
  "!/src/**/tests.rs",
  "!/src/**/*_tests.rs",
  "!/src/**/tests/**",
]

[dependencies]
alpha2-geometry.workspace = true
alpha2-media.workspace = true
alpha2-model.workspace = true
alpha2-time.workspace = true
libm = "0.2.16"
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
alpha2-scaling-support.workspace = true
sha2 = "0.11"

[lints]
workspace = true

[[bench]]
name = "timeline_evaluation"
harness = false

[[bench]]
name = "timeline_features"
harness = false
