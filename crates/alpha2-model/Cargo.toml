[package]
name = "alpha2-model"
version.workspace = true
description = "Versioned project and timeline model for alpha2."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["video", "timeline", "project", "json-schema"]
categories = ["multimedia::video"]
include = [
  "/src/**",
  "/README.md",
  "/LICENSE.md",
  "!/src/**/tests.rs",
  "!/src/**/*_tests.rs",
  "!/src/**/tests/**",
]

[dependencies]
libm = "0.2.16"
alpha2-media.workspace = true
alpha2-time.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
alpha2-scaling-support.workspace = true

[lints]
workspace = true

[features]
schema = ["dep:schemars", "alpha2-media/schema", "alpha2-time/schema"]

[[example]]
name = "emit-schema"
required-features = ["schema"]
