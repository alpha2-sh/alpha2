[package]
name = "alpha2-gpu"
version.workspace = true
description = "GPU context and capability boundary for alpha2."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["gpu", "wgpu", "webgpu", "video"]
categories = ["graphics", "rendering"]
include = [
  "/src/**",
  "/README.md",
  "/LICENSE.md",
  "!/src/**/tests.rs",
  "!/src/**/*_tests.rs",
  "!/src/**/tests/**",
]

[features]
serial-acquisition = []
wgpu-interop = []

[dependencies]
wgpu.workspace = true
web-time = "1.1.0"
log = "0.4.34"

# Must match the version wgpu-hal uses so its raw device casts to the debug info queue.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Direct3D12"] }

[dev-dependencies]
alpha2-test-support.workspace = true
alpha2-gpu = { path = ".", features = ["serial-acquisition"] }
pollster.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
ash = "0.38"

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = [
  "Win32_Graphics_Direct3D12",
  "Win32_Graphics_Dxgi_Common",
] }

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
