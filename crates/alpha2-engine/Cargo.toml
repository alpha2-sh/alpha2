[package]
name = "alpha2-engine"
version.workspace = true
description = "Player and exporter facade for alpha2."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["video", "player", "export", "timeline", "rendering"]
categories = ["multimedia::video", "rendering::engine"]
include = [
  "/src/**",
  "/README.md",
  "/LICENSE.md",
  "!/src/**/tests.rs",
  "!/src/**/*_tests.rs",
  "!/src/**/tests/**",
]

[features]
wgpu-interop = ["alpha2-render/wgpu-interop"]
# Test-only `scripted` and `digest` extractors; no release enables it.
extract-fixtures = []

[dependencies]
libm = "0.2.16"
alpha2-audio.workspace = true
alpha2-eval.workspace = true
alpha2-geometry.workspace = true
alpha2-gpu.workspace = true
alpha2-layout.workspace = true
alpha2-media.workspace = true
alpha2-model.workspace = true
alpha2-render.workspace = true
alpha2-shaders.workspace = true
alpha2-text.workspace = true
alpha2-time.workspace = true
serde.workspace = true
serde_json.workspace = true
web-time = "1.1.0"
wgpu.workspace = true

[dev-dependencies]
alpha2-gpu = { workspace = true, features = ["serial-acquisition"] }
alpha2-golden-support.workspace = true
pollster.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[[bench]]
name = "audio_mix"
harness = false

[[bench]]
name = "export_prefetch"
harness = false
