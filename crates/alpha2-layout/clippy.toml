# Platform math libraries round transcendental functions differently, so layout math goes
# through `libm` to give every host the same result. `sqrt` is correctly rounded everywhere
# and stays allowed.
disallowed-methods = [
  { path = "f32::sin", reason = "platform math library; use `libm::sinf`" },
  { path = "f32::cos", reason = "platform math library; use `libm::cosf`" },
  { path = "f32::tan", reason = "platform math library; use `libm::tanf`" },
  { path = "f32::sin_cos", reason = "platform math library; use `libm::sincosf`" },
  { path = "f32::asin", reason = "platform math library; use `libm::asinf`" },
  { path = "f32::acos", reason = "platform math library; use `libm::acosf`" },
  { path = "f32::atan", reason = "platform math library; use `libm::atanf`" },
  { path = "f32::atan2", reason = "platform math library; use `libm::atan2f`" },
  { path = "f32::sinh", reason = "platform math library; use `libm::sinhf`" },
  { path = "f32::cosh", reason = "platform math library; use `libm::coshf`" },
  { path = "f32::tanh", reason = "platform math library; use `libm::tanhf`" },
  { path = "f32::exp", reason = "platform math library; use `libm::expf`" },
  { path = "f32::exp2", reason = "platform math library; use `libm::exp2f`" },
  { path = "f32::exp_m1", reason = "platform math library; use `libm::expm1f`" },
  { path = "f32::ln", reason = "platform math library; use `libm::logf`" },
  { path = "f32::ln_1p", reason = "platform math library; use `libm::log1pf`" },
  { path = "f32::log", reason = "platform math library; use `libm::logf`" },
  { path = "f32::log2", reason = "platform math library; use `libm::log2f`" },
  { path = "f32::log10", reason = "platform math library; use `libm::log10f`" },
  { path = "f32::powf", reason = "platform math library; use `libm::powf`" },
  { path = "f32::powi", reason = "platform math library; `libm` has no `powi`: multiply, or use `libm::powf`" },
  { path = "f32::cbrt", reason = "platform math library; use `libm::cbrtf`" },
  { path = "f32::hypot", reason = "platform math library; use `libm::hypotf`" },
  { path = "f32::mul_add", reason = "fused multiply-add differs from `a * b + c`; write that" },
  { path = "f64::sin", reason = "platform math library; use `libm::sin`" },
  { path = "f64::cos", reason = "platform math library; use `libm::cos`" },
  { path = "f64::tan", reason = "platform math library; use `libm::tan`" },
  { path = "f64::sin_cos", reason = "platform math library; use `libm::sincos`" },
  { path = "f64::asin", reason = "platform math library; use `libm::asin`" },
  { path = "f64::acos", reason = "platform math library; use `libm::acos`" },
  { path = "f64::atan", reason = "platform math library; use `libm::atan`" },
  { path = "f64::atan2", reason = "platform math library; use `libm::atan2`" },
  { path = "f64::sinh", reason = "platform math library; use `libm::sinh`" },
  { path = "f64::cosh", reason = "platform math library; use `libm::cosh`" },
  { path = "f64::tanh", reason = "platform math library; use `libm::tanh`" },
  { path = "f64::exp", reason = "platform math library; use `libm::exp`" },
  { path = "f64::exp2", reason = "platform math library; use `libm::exp2`" },
  { path = "f64::exp_m1", reason = "platform math library; use `libm::expm1`" },
  { path = "f64::ln", reason = "platform math library; use `libm::log`" },
  { path = "f64::ln_1p", reason = "platform math library; use `libm::log1p`" },
  { path = "f64::log", reason = "platform math library; use `libm::log`" },
  { path = "f64::log2", reason = "platform math library; use `libm::log2`" },
  { path = "f64::log10", reason = "platform math library; use `libm::log10`" },
  { path = "f64::powf", reason = "platform math library; use `libm::pow`" },
  { path = "f64::powi", reason = "platform math library; `libm` has no `powi`: multiply, or use `libm::pow`" },
  { path = "f64::cbrt", reason = "platform math library; use `libm::cbrt`" },
  { path = "f64::hypot", reason = "platform math library; use `libm::hypot`" },
  { path = "f64::mul_add", reason = "fused multiply-add differs from `a * b + c`; write that" },
]

# Format names, not code.
doc-valid-idents = ["SubRip", "WebVTT", "OpenEXR", "ACEScg", ".."]
