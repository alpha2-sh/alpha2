[package]
name = "alpha2-layout"
version.workspace = true
description = "Text and layout boxes measures for alpha2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["text", "layout", "flexbox", "measure", "video"]
categories = ["text-processing", "multimedia::video"]
# Builds from its sources and license alone: tests stay in the repository, where `cargo test` runs.
include = [
  "/src/**",
  "/README.md",
  "/LICENSE.md",
  "!/src/**/tests.rs",
  "!/src/**/*_tests.rs",
  "!/src/**/tests/**",
]

[dependencies]
alpha2-eval.workspace = true
alpha2-geometry.workspace = true
alpha2-media.workspace = true
alpha2-model.workspace = true
alpha2-text.workspace = true
alpha2-time.workspace = true
# The sRGB curve of animator colors, as `alpha2-text` computes it: `libm`, so wasm agrees.
libm = "0.2.16"
serde_json.workspace = true
# Exact: its minor versions break the API and a patch can move pixels. Used by `layout/resolve.rs` alone.
taffy = { version = "=0.15.0", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid"] }

[lints]
workspace = true
