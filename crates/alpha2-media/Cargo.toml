[package]
name = "alpha2-media"
version.workspace = true
description = "Host-independent media vocabulary and I/O contracts for alpha2."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["video", "audio", "media", "codec"]
categories = ["multimedia"]
# Tests, benches and fixtures stay out of the published crate.
include = [
  "/src/**",
  "/README.md",
  "/LICENSE.md",
  "!/src/**/tests.rs",
  "!/src/**/*_tests.rs",
  "!/src/**/tests/**",
]

[dependencies]
alpha2-time.workspace = true
bytes.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true

[features]
schema = ["dep:schemars", "alpha2-time/schema"]
