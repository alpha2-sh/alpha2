[package]
name = "alpha2-geometry"
version.workspace = true
description = "Deterministic vector geometry and coverage rasterization for alpha2 shapes."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["vector", "bezier", "rasterizer", "shapes", "animation"]
categories = ["graphics", "multimedia::video"]
# Tests, benches and fixtures stay out of the published crate.
include = [
  "/src/**",
  "/README.md",
  "/LICENSE.md",
  "!/src/**/tests.rs",
  "!/src/**/*_tests.rs",
  "!/src/**/tests/**",
]

[dependencies]
alpha2-model.workspace = true
# libm keeps trigonometry identical across targets. Linking peniko or svgtypes switches kurbo to
# `std` math, so goldens pin outline bits and scene keys only for libm builds.
kurbo = { version = "0.13.1", default-features = false, features = ["libm"] }
libm = "0.2.16"

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
