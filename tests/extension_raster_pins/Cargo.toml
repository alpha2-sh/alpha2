[package]
name = "alpha2-extension-raster-pins"
version.workspace = true
description = "SVG, Lottie, LaTeX, and PDF rasters of alpha2-extensions that every target must draw within one code of a linux-x64 reference."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["rasters"]
# A feature here so unification does not enable these formats for every alpha2-extensions user.
rasters = ["alpha2-extensions/svg", "alpha2-extensions/lottie", "alpha2-extensions/latex", "alpha2-extensions/pdf"]

[dependencies]
alpha2-extensions.workspace = true
alpha2-model.workspace = true
alpha2-time.workspace = true
png.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true

[lints]
workspace = true
