[package]
name = "alpha2-test-support"
version.workspace = true
description = "The test capability contract (ALPHA2_REQUIRE turns a named capability's skips into failures, and every skip is appended to ALPHA2_SKIP_LOG), the export checks the desktop and device suites share, and a test runner that stops a hung test binary."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde_json.workspace = true
sha2 = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
