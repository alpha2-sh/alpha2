[package]
name = "alpha2-alloc-budget"
version.workspace = true
description = "Allocation budgets for alpha2's per-frame and per-block hot paths."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["lottie"]
# What opening a Lottie document holds (`tests/document_memory.rs`); a feature so that a build
# without default features does not turn the Lottie provider on for every crate.
lottie = ["dep:alpha2-extensions", "alpha2-extensions/lottie"]

[dependencies]
alpha2-extensions = { workspace = true, default-features = false, optional = true }

[dev-dependencies]
alpha2-audio.workspace = true
alpha2-engine = { workspace = true, features = ["wgpu-interop"] }
alpha2-eval.workspace = true
alpha2-gpu = { workspace = true, features = ["wgpu-interop", "serial-acquisition"] }
alpha2-media.workspace = true
alpha2-model.workspace = true
alpha2-native.workspace = true
alpha2-render = { workspace = true, features = ["wgpu-interop"] }
alpha2-time.workspace = true
libm = "0.2.16"
pollster.workspace = true
wgpu.workspace = true

[build-dependencies]
alpha2-build-support.workspace = true

# Not `workspace = true`: counting allocations needs an unsafe `GlobalAlloc`, which the workspace
# forbids; here unsafe code is denied and allowed only in the test files that install it.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
