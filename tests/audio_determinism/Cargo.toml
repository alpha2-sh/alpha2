[package]
name = "alpha2-audio-determinism"
version.workspace = true
description = "One fixed mix whose hash must be identical on every platform alpha2's engine runs on."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Named apart from the library: on Windows a bin and a cdylib of one stem write the same PDB.
[[bin]]
name = "audio-determinism-hashes"
path = "src/main.rs"

[dependencies]
alpha2-audio.workspace = true
alpha2-engine.workspace = true
alpha2-media.workspace = true
alpha2-model.workspace = true
alpha2-time.workspace = true
serde_json.workspace = true

# Not `workspace = true`: the wasm export needs `#[unsafe(no_mangle)]`, which the workspace's
# `forbid(unsafe_code)` cannot allow even on one item.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
