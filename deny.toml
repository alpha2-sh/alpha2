[advisories]
version = 2
yanked = "deny"
# Unmaintained, not vulnerable, and with no drop-in maintained replacement.
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "paste, a proc-macro dependency of rsmpeg; goes when rsmpeg drops it" },
  { id = "RUSTSEC-2026-0206", reason = "rustybuzz, native text shaping; goes with a move to harfrust" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser, native font parsing; goes with the same move" },
  { id = "RUSTSEC-2026-0374", reason = "basic-toml, read by askama in uniffi's binding generator at build time; goes when uniffi drops it" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "0BSD",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
exceptions = [
  # Build-script dependency of pyo3-build-config; linked into nothing.
  { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "target-lexicon" },
  # The mobile bindings' generator and runtime, used unmodified; the notice ships with the
  # mobile packages. File-level copyleft only, and no other crate may bring MPL-2.0.
  { allow = ["MPL-2.0"], crate = "uniffi" },
  { allow = ["MPL-2.0"], crate = "uniffi_bindgen" },
  { allow = ["MPL-2.0"], crate = "uniffi_core" },
  { allow = ["MPL-2.0"], crate = "uniffi_internal_macros" },
  { allow = ["MPL-2.0"], crate = "uniffi_macros" },
  { allow = ["MPL-2.0"], crate = "uniffi_meta" },
  { allow = ["MPL-2.0"], crate = "uniffi_pipeline" },
  { allow = ["MPL-2.0"], crate = "uniffi_udl" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# For the versionless path dev-dependencies on unpublished test crates.
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
